name: Store operations
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-operations
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check Render health
        run: curl --fail --silent --show-error --retry 4 --retry-delay 15 --retry-all-errors --max-time 60 https://ollazen.com/up
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate authenticated catalog, inventory and order report
        env:
          MOREA_API_TOKEN: ${{ secrets.MOREA_API_TOKEN }}
          MOREA_GRAPHQL_URL: ${{ vars.MOREA_GRAPHQL_URL || 'https://morea.ollazen.com/graphql' }}
        run: python script/store_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: store-report
          path: reports/store-report.json
          retention-days: 14
