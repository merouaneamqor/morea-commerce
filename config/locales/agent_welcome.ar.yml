ar:
  agent_welcome:
    title: "مرحبًا بك، %{name}"
    word_of_the_day: "كلمة اليوم"
    start: "هيا نبدأ"
    continue: "واصل"
    milestone_title: "أحسنت يا %{name}!"
    quotes:
      - "كل مكالمة فرصة لإحداث فرق."
      - "عميل مطمئن يعني طلبًا إضافيًا."
      - "الابتسامة تُسمع عبر الهاتف: اتصل بابتسامتك."
      - "خطوة بعد خطوة تُبنى الأرقام الجميلة."
      - "إصرارك هو الذي يصنع الفرق."
      - "اليوم يوم رائع لتحطيم رقمك القياسي."
      - "حسن الإنصات خير من كلام طويل."
      - "لا تعدّ المكالمات، اجعل كل مكالمة تُحسب."
      - "الاستمرارية تتغلب دائمًا على جهد يوم واحد."
      - "كل «نعم» تبدأ بتحية دافئة."
      - "الفرق الكبيرة تُبنى بانتصارات صغيرة."
      - "خذ نفسًا عميقًا: أنت جاهز."
    milestones:
      - "%{count} طلبًا تمت معالجته اليوم: يا لها من سلسلة رائعة!"
      - "%{count} طلبًا تمت معالجته بالفعل. طاقتك معدية!"
      - "%{count} طلبًا تمت معالجته: أنت مذهل. حافظ على هذا الإيقاع!"
      - "رائع، %{count} طلبًا تمت معالجته اليوم. الفريق فخور بك!"
      - "%{count} طلبًا تمت معالجته: رقم قياسي حقيقي. خذ نفسًا ثم نكمل!"
