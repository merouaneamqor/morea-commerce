  privacy_policy:
    purposes: "إدارة الطلبات وتوصيلها، خدمة العملاء (تأكيد هاتفي)، تتبع الطلب، وعند الحاجة مكافحة الاحتيال."
    cndp_authorized: "تم إشعار هذه المعالجة والترخيص لها من طرف اللجنة الوطنية (CNDP) تحت رقم الإيصال أو الترخيص %{number}."
    cndp_pending: "يلتزم مسؤول المعالجة بإشعار هذه المعالجة إلى اللجنة الوطنية لمراقبة حماية المعطيات ذات الطابع الشخصي (CNDP) وفقًا للقانون 09-08."
    cookies_section: "ملفات تعريف ارتباط تقنية ضرورية للسلة والجلسة. قد تُستخدم أيضًا ملفات قياس (Meta Pixel، TikTok Pixel) عند تفعيلها في المتجر. يظهر إشعار معلوماتي يوضح ذلك عند الزيارة."
    retention: "تُحفظ بيانات الطلب فقط للمدة اللازمة للتوصيل والالتزامات القانونية والمحاسبية، ثم تُؤرشف أو تُحذف بشكل متناسب."
    prospecting: "لا تُستخدم بياناتك للتسويق المباشر دون موافقتك المسبقة. يمكنك الاعتراض في أي وقت بالتواصل مع العنوان أدناه."
    recipients:
      store_staff: "• فريق المتجر (معالجة الطلبات)"
      sendit: "• Sendit (الشحن داخل المغرب)"
      hosting: "• مزود الاستضافة التقنية للموقع (بنية آمنة)"
    body: |
      %{controller}

      المعلومات المجمعة على %{site} تُعالج لـ %{purposes}

      مستلمو البيانات:
      %{recipients}

      الحقول الإلزامية عند الطلب (الاسم، الهاتف، عنوان التوصيل) ضرورية لمعالجة طلبك وتوصيله. الحقول الأخرى اختيارية.

      %{cndp_clause}

      لممارسة حقوق الوصول والتصحيح والاعتراض، تواصلي مع: %{contact}

      %{cookies}

      %{retention}

      %{prospecting}
  platform_home:
    title: "Codify — منصة تجارة متعددة المتاجر"
    language: "اللغة"
    nav: { journey: "كيف تعمل", features: "المزايا", integrations: "التكاملات", faq: "الأسئلة", sign_in: "تسجيل الدخول", signup: "إنشاء حساب" }
    hero:
      eyebrow: "منصة تجارة إلكترونية متعددة المتاجر"
      headline: "أدِر متاجرك بالدفع عند الاستلام من منصة واحدة."
      lead: "يحتفظ كل متجر بواجهته وكتالوجه وطلباته. ويؤكد فريقك الطلبات ويدير المخزون ويشحن من لوحة إدارة واحدة."
      primary: "إنشاء حساب"
      secondary: "شاهد مسار الطلب"
      store_hint: "تبحث عن متجر؟ افتحه على عنوانه الخاص، مثل متجرك.%{domain}."
      badges: [ "واجهات متاجر منفصلة", "الدفع عند الاستلام", "العربية · الفرنسية · الإنجليزية", "واجهة برمجية وMCP" ]
    journey:
      title: "طلب واحد، من الشراء إلى التسليم"
      lead: "السجل نفسه يتبع الطلب في كل خطوة، دون جداول بيانات."
      steps:
        - { title: "تقديم الطلب", body: "يطلب العميل من واجهة المتجر، أو ترسل أداة متصلة الطلب عبر الواجهة البرمجية." }
        - { title: "التأكيد", body: "يستلم الموظفون الطلب من قائمة انتظار، ويتصلون بالعميل ويسجلون النتيجة أو موعد معاودة الاتصال." }
        - { title: "حجز المخزون", body: "عند تأكيد الطلب تُحجز مواده حتى لا تُباع الوحدة نفسها مرتين." }
        - { title: "الشحن", body: "يُرسل الطلب إلى شركة الشحن المتصلة، وتعود الملصقة والتتبع إلى لوحة الإدارة." }
        - { title: "التسليم أو الإرجاع", body: "تنقل تحديثات شركة الشحن الطلب إلى تم التسليم أو مُرجَع، مع حفظ السجل على الطلب." }
    preview:
      title: "يومك في لمحة"
      note: "رسم توضيحي لنظرة الإدارة العامة. الأرقام أمثلة وليست بيانات حقيقية."
      metrics: [ { label: "طلبات جديدة", value: "42" }, { label: "مؤكدة", value: "31" }, { label: "مشحونة", value: "27" }, { label: "مسلَّمة", value: "19" } ]
    features:
      title: "كل ما يحتاجه فريق المتجر"
      lead: "مصمم للمتاجر التي تبيع بالدفع عند الاستلام."
      items:
        - { title: "واجهة لكل متجر", body: "عنوان وكتالوج ومجموعات وصفحات وسلة خاصة بكل متجر، ومعزولة عن بقية المتاجر." }
        - { title: "إدارة الطلبات", body: "إنشاء الطلبات وتعديلها والتعليق عليها وأرشفتها ونسخها، وطباعة قسائم التجهيز." }
        - { title: "قائمة التأكيد", body: "استلام حصري ومعاودة اتصال وملاحظات داخلية ونتائج واضحة لكل طلب." }
        - { title: "المنتجات والمخزون", body: "متغيرات ومعارض ألوان وسجل لكل حركة مخزون." }
        - { title: "الشحن", body: "إرسال الطلبات إلى شركة الشحن المتصلة وطباعة الملصقات ومزامنة حالة التسليم." }
        - { title: "حسابات الفريق", body: "يسجل الفريق الدخول إلى متجره، مع جلسات تنتهي صلاحيتها وسجل تدقيق." }
        - { title: "بكسلات التتبع", body: "أضف بكسل ميتا وتيك توك لكل متجر." }
        - { title: "واجهة برمجية وأتمتة", body: "تتيح رموز المتجر وGraphQL وMCP للأدوات المتصلة قراءة المتجر وإدارته." }
    integrations:
      title: "يتصل بما تستخدمه"
      lead: "اتصالات الشحن والإعلانات والأتمتة المتاحة اليوم."
      items: [ "شحن Sendit", "Meta Pixel", "TikTok Pixel", "تنبيهات Discord", "GraphQL", "MCP", "OAuth" ]
    faq:
      title: "أسئلة"
      items:
        - { q: "هل هذا سوق إلكتروني؟", a: "لا. لكل متجر عنوانه وواجهته. المنصة هي الإدارة التي تقف خلفها." }
        - { q: "ما اللغات المدعومة؟", a: "تدعم الواجهات العربية والفرنسية والإنجليزية، بما في ذلك التخطيط من اليمين إلى اليسار." }
        - { q: "ما شركات الشحن المتاحة؟", a: "Sendit متصلة اليوم للشحن داخل المغرب." }
        - { q: "هل تستطيع أدواتي إرسال الطلبات؟", a: "نعم. يتيح رمز المتجر لأداة متصلة إنشاء الطلبات عبر الواجهة البرمجية، ولا يتكرر الطلب عند إعادة المحاولة." }
        - { q: "كيف أفتح متجرا؟", a: "أنشئ حسابك المجاني وتحقّق من بريدك الإلكتروني. استكشف مساحة عملك ثم اشترك لاستخدام أدواتها." }
    cta:
      headline: "مستعد لإدارة متجرك؟"
      body: "أنشئ حسابك مجاناً. اشترك عندما تكون مستعداً لاستخدام أدواتك."
      button: "إنشاء حساب"
    footer:
