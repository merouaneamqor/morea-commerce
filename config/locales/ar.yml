    checkout_notice_with_cndp: "وفقًا للقانون 09-08، لكِ حق الوصول والتصحيح والاعتراض لأسباب مشروعة. تم إشعار هذه المعالجة إلى اللجنة الوطنية (CNDP) تحت الرقم %{number}."
