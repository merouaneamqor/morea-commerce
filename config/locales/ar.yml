  privacy_policy:
    purposes: "إدارة الطلبات وتوصيلها، خدمة العملاء (تأكيد هاتفي)، تتبع الطلب، وعند الحاجة مكافحة الاحتيال."
    cndp_authorized: "تم إشعار هذه المعالجة والترخيص لها من طرف اللجنة الوطنية (CNDP) تحت رقم الإيصال أو الترخيص %{number}."
    cndp_pending: "يلتزم مسؤول المعالجة بإشعار هذه المعالجة إلى اللجنة الوطنية لمراقبة حماية المعطيات ذات الطابع الشخصي (CNDP) وفقًا للقانون 09-08."
    cookies_section: "ملفات تقنية ضرورية للسلة والجلسة. ملفات القياس (Meta Pixel، TikTok Pixel، Google Analytics) تُحمَّل فقط بعد القبول في الشريط. يمكنك رفض القياس ومتابعة التسوّق."
    retention: "تُحفظ بيانات الطلب فقط للمدة اللازمة للتوصيل والالتزامات القانونية والمحاسبية، ثم تُؤرشف أو تُحذف بشكل متناسب."
    prospecting: "لا تُستخدم بياناتك للتسويق المباشر دون موافقتك المسبقة. يمكنك الاعتراض في أي وقت بالتواصل مع العنوان أدناه أو عبر نموذج الحقوق على هذا الموقع."
    recipients:
      store_staff: "• فريق المتجر (معالجة الطلبات)"
      sendit: "• Sendit (الشحن داخل المغرب)"
      hosting: "• مزود الاستضافة التقنية للموقع (بنية آمنة)"
    body: |
      %{controller}

      المعلومات المجمعة على %{site} تُعالج لـ %{purposes}

      مستلمو البيانات:
      %{recipients}

      الحقول الإلزامية عند الطلب (الاسم، الهاتف، عنوان التوصيل) ضرورية لمعالجة طلبك وتوصيله. الحقول الأخرى اختيارية.

      %{cndp_clause}

      لممارسة حقوق الوصول والتصحيح والاعتراض، تواصلي مع: %{contact}

      %{cookies}

      %{retention}

      %{prospecting}
  terms_of_service:
    body: |
      تحكم هذه الشروط المشتريات على %{site}، التي يديرها %{store}.

      الطلبات بالدفع عند الاستلام (%{currency}). المجموع الظاهر عند الدفع (المنتجات والخصومات والتوصيل بعد اختيار المدينة) هو المبلغ الذي تدفعينه للمندوب. لا رسوم مخفية عبر الإنترنت.

      يجب أن يكون عمرك على الأقل %{age} سنة لتقديم طلب. أوصاف المنتجات ليست ادعاءات طبية أو استثمارية أو منظّمة ما لم يُذكر ذلك صراحة وبأدلة.

      الإرجاع والاسترداد يتبعان صفحة الإرجاع في المتجر. للاستفسار: %{contact}.
  cookie_policy:
    body: |
      يستخدم %{store} ملفات تعريف الارتباط على %{site}.

      الملفات الضرورية تشغّل السلة واللغة والجلسة ولا تتطلب موافقة.

      ملفات القياس (Meta Pixel، TikTok Pixel، Google Analytics) تساعد على فهم الزيارات والإعلانات، وتُحمَّل فقط عند الضغط على قبول. ارفضي القياس للتصفح دونها.

      انظري أيضًا صفحة الخصوصية: %{privacy_path}. للتواصل: %{contact}.
