    secret_help: "Shopify وYouCan: سر العميل للتطبيق. WooCommerce: السر الذي اخترته في إعدادات الويب هوك."
    setup_lead: "اربط متجرك عبر ويب هوك موقّع تضبطه في متجرك الحالي. تثبيت التطبيقات واستيراد الطلبات السابقة غير متاحين بعد."
    save: "حفظ وعرض الإعدادات"
    back: "رجوع"
