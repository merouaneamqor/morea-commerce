en:
  connections:
    title: "Connected stores"
    lead: "Manage connections to your existing stores. A Codify storefront is optional."
    add: "Connect a store"
    name: "Connection name"
    provider: "Platform"
    domain: "Store hostname"
    status: "Status"
    choose: "Choose a platform"
    domain_help: "Enter the hostname only. For Shopify use your permanent shop.myshopify.com hostname."
    store_id: "YouCan store ID"
    store_id_help: "Required for YouCan. Copy your store UUID from your YouCan account."
    secret: "Webhook signing secret"
    secret_help: "YouCan: your app client secret. WooCommerce: the webhook secret you choose in its settings."
    setup_lead: "Connect using a signed order webhook configured in your existing store. App installation and historical order import are not included yet."
    save: "Save and show setup"
    back: "Back"
    saved: "Connection saved. Complete the webhook setup to start receiving orders."
    updated: "Connection updated."
    delete: "Delete connection"
    delete_confirm: "Delete %{name}? This removes its local credentials and cannot be undone. It does not uninstall the app from your store."
    deleted: "Connection deleted."
    delete_blocked: "This connection has order delivery history and cannot be deleted. Disconnect it to stop receiving orders and preserve the history."
    setup: "Finish connecting your store"
    rotate_secret: "Replace signing secret"
    resume_help: "After resuming, check that your provider's webhook subscription is still active; it may need to be enabled or created again."
    youcan_limit: "YouCan deliveries must include full payment, shipping address and product details. Incomplete events are rejected; automatic retrieval of missing details is not included yet."
    webhook_url: "Delivery URL"
    verification_help: "Configure this delivery URL in your platform, using the matching signing secret. Status changes after a valid signed order delivery. Use your platform's delivery history to retry failed events."
    scope_help: "Receives new unpaid COD orders in MAD for delivery in Morocco, without tax, discounts or extra fees. Historical import, upstream changes, cancellations and catalog or stock sync are not included yet."
    disconnect: "Disconnect"
    reconnect: "Resume receiving orders"
    empty: "Connect your Shopify, WooCommerce or YouCan store."
    deliveries: "Recent order deliveries"
    external_id: "External order ID"
    order: "Codify order"
    received: "Received"
    accepted: "Received"
    rejected: "Needs attention: %{code}"
    no_deliveries: "No order deliveries yet. Complete the setup in your existing store."
    delivery_error: "Delivery needs attention: %{code}. Check the order and webhook settings in your platform, then retry the delivery."
    source: "Source store"
    all_sources: "All sources"
    filter: "Filter"
    snapshot_help: "Product names and prices come from the source store. These lines do not change Codify inventory. Confirm and fulfill the order here; commercial edits remain locked."
    external_order_locked: "Imported order prices and products are preserved from the source store. Commercial editing and duplication are unavailable."
    shopify_setup:
      title: Connect Shopify
      intro: Install the Seallo app to connect your Shopify store through its API.
      before_start: You need permission to install apps in your Shopify store.
      step_one_title: Enter your Shopify store
      step_one_body: Enter a connection name and your permanent example.myshopify.com
        domain.
      step_two_title: Approve access in Shopify
      step_two_body: 'Select Connect Shopify, then approve the Seallo app. Requested permissions:
        write_orders, read_orders, read_customers and read_products. write_orders includes
        read_orders.'
      step_three_title: Return to Seallo
      step_three_body: After approval, return here to see the granted permissions. Use
        Test API connection to check store access.
      supported_title: Customer data access
      supported_body: Customer names, email, phone numbers and addresses may require Shopify
        approval for protected customer data.
      unavailable_title: Synchronization
      unavailable_body: Connecting verifies API access. Automatic order import, order
        updates, product sync and stock sync are not enabled.
      domain_help: Use example.myshopify.com without https:// or a path.
    shopify_api:
      title: Shopify API connection
      save_help: You will continue to Shopify to install the Seallo app and approve access.
      saved: Shopify connection saved. Continue to Shopify to approve access.
      verified: Shopify API connection verified.
      connected: API access verified.
      configured: Shopify authorization saved. Test the connection to check API access.
      not_configured: Connect Shopify to authorize the Seallo app.
      test: Test API connection
      test_help: This test reads the store domain and app permissions. It does not import
        or change orders, products or stock.
      last_checked: 'Last verified: %{time}'
      permissions: Verified permissions
      reconnect: Reconnect API
      imported_orders: Recent imported orders
      no_imported_orders: No imported orders yet. API verification does not import orders.
      states:
        connected: API connected
        configured: API check needed
        missing: Shopify authorization needed
      errors:
        connection_failed: API verification failed. Check the app setup and try again.
        credentials_missing: Authorize the Seallo app to connect Shopify.
        disconnected: Reconnect this store before testing the API.
        invalid_credentials: Shopify access is no longer valid. Authorize the app again.
        shop_not_permitted: The Seallo app cannot access this store. Check the store domain
          and app installation.
        missing_scopes: Required permissions are missing. Authorize the Seallo app again
          and approve the requested permissions.
        source_mismatch: The API returned a different store. Check the permanent myshopify.com
          domain.
        rate_limited: Shopify is limiting requests. Try the connection test again later.
        unavailable: Shopify could not be reached. Try again later.
        invalid_response: Shopify returned an unexpected response. Try again later.
        config_missing: Shopify connection is not configured yet. Contact the platform
          administrator.
        authorization_failed: Shopify authorization failed. Try connecting again.
        authorization_expired: Shopify authorization expired. Connect Shopify again.
        invalid_state: This authorization request is no longer valid. Start the connection
          again from Seallo.
        invalid_signature: Shopify authorization could not be verified. Start the connection
          again from Seallo.
      connect: Connect Shopify
      reauthorize: Authorize Shopify again
    providers: { shopify: "Shopify", woocommerce: "WooCommerce", youcan: "YouCan" }
    states:
      disconnected: "Disconnected"
      attention: "Needs attention"
      verified: "Receiving orders"
      awaiting: "Awaiting signed delivery"
    instructions:
      woocommerce: "In WooCommerce → Settings → Advanced → Webhooks, add an active Order created webhook. Set the delivery URL below and the same secret you entered here."
      youcan: "In your YouCan app, subscribe to order.created with this delivery URL. Use the app client secret and your store UUID."
