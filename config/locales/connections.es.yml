    external_order_locked: "Los precios y productos importados se conservan desde la tienda de origen. La edición comercial y la duplicación no están disponibles."
    shopify_setup:
      title: Conectar Shopify
      intro: Instala la aplicación Seallo para conectar tu tienda Shopify mediante su API.
      before_start: Debes poder instalar aplicaciones en tu tienda Shopify.
      step_one_title: Indica tu tienda Shopify
      step_one_body: Introduce un nombre de conexión y tu dominio permanente ejemplo.myshopify.com.
      step_two_title: Autoriza el acceso en Shopify
      step_two_body: 'Haz clic en Conectar Shopify y después autoriza la aplicación Seallo. Autorizaciones solicitadas: write_orders, read_orders, read_customers y read_products. write_orders incluye read_orders.'
      step_three_title: Vuelve a Seallo
      step_three_body: Tras la autorización, encontrarás aquí los permisos concedidos. Usa Probar la conexión API para verificar el acceso.
      supported_title: Acceso a los datos de clientes
      supported_body: Los nombres, correos electrónicos, teléfonos y direcciones pueden requerir la aprobación de Shopify para los datos protegidos de clientes.
      unavailable_title: Sincronización
      unavailable_body: La conexión verifica el acceso API. La importación automática de pedidos, sus modificaciones y la sincronización de productos o del stock no están activadas.
      domain_help: Usa ejemplo.myshopify.com sin https:// ni ruta.
    shopify_api:
      title: Conexión API de Shopify
      save_help: Se te redirigirá a Shopify para instalar la aplicación Seallo y autorizar el acceso.
      saved: Conexión Shopify guardada. Continúa hacia Shopify para autorizar el acceso.
      verified: Conexión API de Shopify verificada.
      connected: Acceso API verificado.
      configured: Autorización de Shopify guardada. Prueba la conexión para verificar el acceso API.
      not_configured: Conecta Shopify para autorizar la aplicación Seallo.
      test: Probar la conexión API
      test_help: Esta prueba lee el dominio y las autorizaciones de la aplicación. No importa ni modifica pedidos, productos ni stocks.
      last_checked: 'Última verificación: %{time}'
      permissions: Autorizaciones verificadas
      reconnect: Reconectar la API
      imported_orders: Últimos pedidos importados
      no_imported_orders: Ningún pedido importado. La verificación de la API no importa pedidos.
      states:
        connected: API conectada
        configured: API por verificar
        missing: Autorización de Shopify necesaria
      errors:
        connection_failed: Error en la verificación de la API. Comprueba la configuración e inténtalo de nuevo.
        credentials_missing: Autoriza la aplicación Seallo para conectar Shopify.
        disconnected: Reconecta la tienda antes de probar la API.
        invalid_credentials: El acceso a Shopify ya no es válido. Autoriza de nuevo la aplicación.
        shop_not_permitted: La aplicación Seallo no puede acceder a esta tienda. Comprueba el dominio y la instalación.
        missing_scopes: Faltan autorizaciones. Autoriza de nuevo la aplicación Seallo y aprueba los permisos solicitados.
        source_mismatch: La API ha devuelto otra tienda. Comprueba el dominio permanente myshopify.com.
        rate_limited: Shopify limita las solicitudes. Repite la prueba más tarde.
        unavailable: Shopify no está accesible. Inténtalo de nuevo más tarde.
        invalid_response: Respuesta inesperada de Shopify. Inténtalo de nuevo más tarde.
        config_missing: La conexión con Shopify aún no está configurada. Contacta con el administrador de la plataforma.
        authorization_failed: La autorización de Shopify ha fallado. Vuelve a intentar la conexión.
        authorization_expired: La autorización de Shopify ha caducado. Conecta Shopify de nuevo.
        invalid_state: Esta solicitud de autorización ya no es válida. Vuelve a empezar la conexión desde Seallo.
        invalid_signature: No se ha podido verificar la autorización de Shopify. Vuelve a empezar la conexión desde Seallo.
      connect: Conectar Shopify
      reauthorize: Autorizar Shopify de nuevo
    providers: { shopify: "Shopify", woocommerce: "WooCommerce", youcan: "YouCan" }
    states:
      disconnected: "Desconectada"
      attention: "A revisar"
      verified: "Recepción activa"
      awaiting: "A la espera de un envío firmado"
    instructions:
      woocommerce: "En WooCommerce → Ajustes → Avanzado → Webhooks, añade un webhook activo Pedido creado. Indica la URL de abajo y el mismo secreto que has introducido aquí."
      youcan: "En tu aplicación YouCan, suscríbete a order.created con esta URL. Usa el secreto de cliente de la aplicación y el UUID de tu tienda."
