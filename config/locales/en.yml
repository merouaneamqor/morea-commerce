    email: "Email"
    phone: "Phone (optional)"
    submit: "Send request"
    have_account: "Already have an account?"
    sign_in: "Sign in"
    fix_fields: "Please check the highlighted fields."
    throttled: "Too many requests. Please try again later."
    errors:
