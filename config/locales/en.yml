  privacy_policy:
    purposes: "order fulfilment and delivery, customer care (phone confirmation), order tracking and, where applicable, fraud prevention."
    cndp_authorized: "This processing was notified to and authorized by the CNDP under receipt or authorization no. %{number}."
    cndp_pending: "The data controller undertakes to notify this processing to Morocco’s CNDP (Commission Nationale de contrôle de la protection des données à caractère personnel) as required by Law 09-08."
    cookies_section: "Strictly necessary cookies power your bag and session. Measurement cookies (Meta Pixel, TikTok Pixel) may also be used when the store has enabled them. An informational banner explains this on your visit."
    retention: "Order-related data is kept only as long as needed for delivery, applicable legal and accounting obligations, then archived or deleted proportionately."
    prospecting: "Your data is not used for direct marketing without your prior consent. You may object at any time by contacting the address below."
    recipients:
      store_staff: "• The store team (order processing)"
      sendit: "• Sendit (shipping within Morocco)"
      hosting: "• The site’s hosting provider (secured infrastructure)"
    body: |
      %{controller}

      Information collected on %{site} is processed for %{purposes}

      Data recipients:
      %{recipients}

      Fields marked as required at checkout (name, phone, delivery address) are needed to process and deliver your order. Other fields are optional.

      %{cndp_clause}

      To exercise your rights of access, rectification and objection, contact: %{contact}

      %{cookies}

      %{retention}

      %{prospecting}
  platform_home:
    title: "Codify — multi-store commerce platform"
    language: "Language"
    nav: { journey: "How it works", features: "Features", integrations: "Integrations", faq: "FAQ", sign_in: "Sign in", signup: "Create account" }
    hero:
      eyebrow: "Multi-store commerce platform"
      headline: "Run cash-on-delivery stores from one platform."
      lead: "Each store keeps its own storefront, catalog and checkout. Your team confirms orders, manages stock and ships from a single admin."
      primary: "Create account"
      secondary: "See how an order flows"
      store_hint: "Looking for a store? Open it on its own address, for example your-store.%{domain}."
      badges: [ "Separate storefronts", "Cash on delivery", "French · English · Arabic", "API and MCP" ]
    journey:
      title: "One order, from checkout to delivery"
      lead: "The same record follows an order through every step, so nobody works from a spreadsheet."
      steps:
        - { title: "Order placed", body: "A customer checks out on the storefront, or a connected tool sends the order through the API." }
        - { title: "Confirmation", body: "Staff claim the order from a queue, call the customer and record the outcome or a callback time." }
        - { title: "Stock reserved", body: "When an order is confirmed, its items are reserved so the same unit is not sold twice." }
        - { title: "Shipped", body: "The order is sent to the connected carrier, and the label and tracking come back to the admin." }
        - { title: "Delivered or returned", body: "Carrier updates move the order to delivered or returned, with the history kept on the order." }
    preview:
      title: "Your day at a glance"
      note: "Illustration of the admin overview. The figures are examples, not real data."
      metrics: [ { label: "New orders", value: "42" }, { label: "Confirmed", value: "31" }, { label: "Shipped", value: "27" }, { label: "Delivered", value: "19" } ]
    features:
      title: "Everything a store team needs"
      lead: "Built for stores that sell with cash on delivery."
      items:
        - { title: "Storefront per store", body: "Own address, catalog, collections, pages and cart. Stores are isolated from each other." }
        - { title: "Order desk", body: "Create, edit, comment on, archive and duplicate orders, and print packing slips." }
        - { title: "Confirmation queue", body: "Exclusive claims, callbacks, internal notes and clear outcomes for each order." }
        - { title: "Products and stock", body: "Variants, colour galleries and a stock history for every movement." }
        - { title: "Shipping", body: "Send orders to the connected carrier, print labels and sync delivery status." }
        - { title: "Staff accounts", body: "Staff sign in to their own store, with expiring sessions and an audit trail." }
        - { title: "Tracking pixels", body: "Add Meta and TikTok pixels per store." }
        - { title: "API and automation", body: "Store tokens, GraphQL and MCP let connected tools read and manage a store." }
    integrations:
      title: "Connects to what you already use"
      lead: "Carrier, ads and automation connections that exist today."
      items: [ "Sendit shipping", "Meta Pixel", "TikTok Pixel", "Discord order alerts", "GraphQL API", "MCP", "OAuth" ]
    faq:
      title: "Questions"
      items:
        - { q: "Is this a marketplace?", a: "No. Every store has its own address and storefront. The platform is the admin behind them." }
        - { q: "Which languages are supported?", a: "Storefronts support French, English and Arabic, including right-to-left layout." }
        - { q: "Which carriers can I use?", a: "Sendit is connected today for shipping within Morocco." }
        - { q: "Can my tools send orders?", a: "Yes. A store token lets a connected tool create orders through the API. Orders are never duplicated when a request is retried." }
        - { q: "How do I open a store?", a: "Create your free account and verify your email. You can explore your workspace, then subscribe to start using its tools." }
    cta:
      headline: "Ready to run your store?"
      body: "Create your account for free. Subscribe when you’re ready to use your tools."
      button: "Create account"
    footer:
      tagline: "Multi-store commerce platform"
      admin: "Sign in"
  signup:
    title: "Request access — %{name}"
    heading: "Request access"
    lead: "Tell us about your store. A platform administrator reviews each request and creates your store. Nothing is created until it is approved."
