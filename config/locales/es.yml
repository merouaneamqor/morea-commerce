  privacy_policy:
    purposes: la gestión y la entrega de tus pedidos, la relación con el cliente (confirmación
      por teléfono), el seguimiento del pedido y, en su caso, la lucha contra el fraude.
    cndp_authorized: Este tratamiento ha sido notificado y autorizado por la CNDP
      con el acuse de recibo o la autorización n.º %{number}.
    cndp_pending: El responsable del tratamiento se compromete a notificar este tratamiento
      a la Comisión Nacional de control de la protección de datos de carácter personal
      (CNDP) de conformidad con la ley 09-08.
    cookies_section: Se necesitan cookies técnicas para el carrito y la sesión. También
      pueden usarse cookies de medición (Meta Pixel, TikTok Pixel) cuando la tienda
      las haya activado. Un banner informativo te avisa de ello durante tu visita.
    retention: Los datos vinculados a un pedido se conservan durante el tiempo necesario
      para la entrega y para las obligaciones contables y legales aplicables, y después
      se archivan o se eliminan de forma proporcionada.
    prospecting: Tus datos no se utilizan con fines de prospección comercial sin tu
      consentimiento previo. Puedes oponerte en cualquier momento contactando con
      el servicio indicado a continuación.
    recipients:
      store_staff: • El equipo de la tienda (tratamiento de los pedidos)
      sendit: • Sendit (transporte y entrega en Marruecos)
      hosting: • El proveedor de alojamiento técnico del sitio (infraestructura segura)
    body: '%{controller}


      La información recogida en %{site} es objeto de un tratamiento informático destinado
      a %{purposes}


      Destinatarios de los datos:

      %{recipients}


      Los campos marcados como obligatorios en el momento del pedido (nombre, teléfono,
      dirección de entrega) son necesarios para tramitar y entregar tu pedido. Los
      demás campos son opcionales.


      %{cndp_clause}


      Puedes ejercer tus derechos de acceso, rectificación y oposición contactando
      con: %{contact}


      %{cookies}


      %{retention}


      %{prospecting}

      '
  platform_home:
    title: Codify — plataforma de comercio electrónico multitienda
    language: Idioma
    nav:
      journey: Cómo funciona
      features: Funcionalidades
      integrations: Integraciones
      faq: FAQ
      sign_in: Iniciar sesión
      signup: Crear una cuenta
    hero:
      eyebrow: Plataforma de comercio electrónico multitienda
      headline: Gestiona tus tiendas de pago contra reembolso desde una sola plataforma.
      lead: Cada tienda conserva su escaparate, su catálogo y su pago. Tu equipo confirma
        los pedidos, gestiona el stock y envía desde una única administración.
      primary: Crear una cuenta
      secondary: Ver el recorrido de un pedido
      store_hint: ¿Buscas una tienda? Ábrela en su propia dirección, por ejemplo tu-tienda.%{domain}.
      badges:
      - Escaparates separados
      - Pago contra reembolso
      - Francés · Inglés · Árabe
      - API y MCP
    journey:
      title: Un pedido, del pago a la entrega
      lead: El mismo expediente sigue el pedido en cada etapa, sin hojas de cálculo.
      steps:
      - title: Pedido realizado
        body: El cliente hace el pedido en el escaparate, o una herramienta conectada
          envía el pedido por la API.
      - title: Confirmación
        body: El equipo toma el pedido de una cola, llama al cliente y registra el
          resultado o una rellamada.
      - title: Stock reservado
        body: Al confirmar, los artículos se reservan para no vender dos veces la
          misma unidad.
      - title: Enviado
        body: El pedido sale hacia el transportista conectado, y la etiqueta y el
          seguimiento vuelven a la administración.
      - title: Entregado o devuelto
        body: Las actualizaciones del transportista pasan el pedido a entregado o
          devuelto, conservando el historial.
    preview:
      title: Tu día de un vistazo
      note: Ilustración de la vista general de la administración. Las cifras son ejemplos,
        no datos reales.
      metrics:
      - label: Pedidos nuevos
        value: '42'
      - label: Confirmados
        value: '31'
      - label: Enviados
        value: '27'
      - label: Entregados
        value: '19'
    features:
      title: Todo lo que necesita un equipo de tienda
      lead: Diseñado para las tiendas que venden con pago contra reembolso.
      items:
      - title: Un escaparate por tienda
        body: Dirección, catálogo, colecciones, páginas y carrito propios. Las tiendas
          están aisladas entre sí.
      - title: Gestión de pedidos
        body: Crea, edita, comenta, archiva y duplica pedidos, e imprime los albaranes
          de preparación.
      - title: Cola de confirmación
        body: Toma exclusiva, rellamadas, notas internas y resultados claros para
          cada pedido.
      - title: Productos y stock
        body: Variantes, galerías por color e historial de cada movimiento de stock.
      - title: Envío
        body: Envío al transportista conectado, impresión de etiquetas y sincronización
          del estado de entrega.
      - title: Cuentas de equipo
        body: El equipo inicia sesión en su tienda, con sesiones que caducan y registro
          de auditoría.
      - title: Píxeles de seguimiento
        body: Añade los píxeles de Meta y TikTok por tienda.
      - title: API y automatización
        body: Los tokens de tienda, GraphQL y MCP permiten a herramientas conectadas
          leer y gestionar una tienda.
    integrations:
      title: Se conecta con tus herramientas
      lead: Las conexiones de transportista, publicidad y automatización disponibles
        hoy.
      items:
      - Envío Sendit
      - Meta Pixel
      - TikTok Pixel
      - Alertas de Discord
      - API GraphQL
      - MCP
      - OAuth
    faq:
      title: Preguntas
      items:
      - q: ¿Es un marketplace?
        a: No. Cada tienda tiene su propia dirección y su escaparate. La plataforma
          es la administración que hay detrás.
      - q: ¿Qué idiomas son compatibles?
        a: Los escaparates admiten francés, inglés y árabe, incluido el diseño de
          derecha a izquierda.
      - q: ¿Qué transportistas puedo usar?
        a: Hoy está conectado Sendit para los envíos en Marruecos.
      - q: ¿Pueden mis herramientas enviar pedidos?
        a: Sí. Un token de tienda permite a una herramienta conectada crear pedidos
          por la API. Una solicitud repetida no crea duplicados.
      - q: ¿Cómo abro una tienda?
        a: Crea tu cuenta gratuita y verifica tu email. Explora tu espacio y después
          suscríbete para usar sus herramientas.
    cta:
      headline: ¿Listo para gestionar tu tienda?
      body: Crea tu cuenta gratuita, verifica tu email y elige una suscripción cuando
        estés listo.
      button: Crear una cuenta
    footer:
      tagline: Plataforma de comercio electrónico multitienda
      admin: Acceso a la administración
      imprint: The Seallo Connect privacy and terms pages name the platform operator
        and the contracts. Each merchant store publishes its own legal entity, registration,
        and privacy page.
    gate:
      coming_soon:
        body: One place to confirm cash-on-delivery orders, count the profit, and
          ship. We are putting the last pieces in place.
        eyebrow: Coming soon
        heading: Seallo opens soon.
        note: Already have a workspace? Sign in to your admin.
        title: Coming soon — Seallo
      maintenance:
        body: Seallo is briefly unavailable while we finish an update. Your stores,
          orders, and accounts are safe.
        eyebrow: Under maintenance
        heading: We'll be back shortly.
        note: If you already have a workspace, you can still sign in.
        title: Under maintenance — Seallo
      sign_in: Sign in
    seallo:
      dash_short: Dashboard
