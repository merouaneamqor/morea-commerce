  cookie_policy:
    body: '%{store} uses cookies on %{site}.


      Necessary cookies keep your bag, locale and session working. They do not require
      consent.


      Measurement cookies (Meta Pixel, TikTok Pixel) help understand visits and ads.
      They load only if you press Accept on the cookie banner. Reject measurement
      to browse without them.


      See also the privacy page at %{privacy_path}. Contact: %{contact}.

      '
