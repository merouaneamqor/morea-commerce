      you provided.
    title: Your data rights
    types:
      access: Access my data
      delete: Delete my data
      object: Object to processing
      rectify: Correct my data
      unsubscribe: Stop marketing
    unsubscribe_note: This storefront does not send marketing email campaigns. Choose
      “Stop marketing” if you received a promotional message from the merchant by
      another channel, or to record your preference.
  terms_of_service:
    body: 'These terms govern purchases on %{site}, operated by %{store}.


      Orders are cash on delivery (%{currency}). The total shown at checkout (products,
      discounts and shipping once your city is selected) is the amount you pay the
      courier. There are no hidden online fees.


      You must be at least %{age} years old to place an order. Product descriptions
      must not be treated as medical, investment or other regulated claims unless
      expressly stated and evidenced.


      Returns and refunds follow the store’s returns page. For questions, contact
      %{contact}.

      '
