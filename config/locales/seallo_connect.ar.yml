ar:
  seallo_connect:
    title: Seallo Connect
    instructions: أنشئ رمزًا، ثم الصقه في Seallo Connect من لوحة إدارة Shopify. تنتهي صلاحية الرمز بعد 10 دقائق ويربط المتجر بمساحة العمل هذه. حافظ على سريته.
    generate_code: إنشاء رمز الربط
    import_help: تصل الطلبات المغربية المؤهلة بالدرهم المغربي والدفع عند الاستلام كطلبات جديدة. وتخضع عمليات التأكيد والمخزون والشحن للقواعد الحالية لمساحة العمل.
    connection_states:
      configured: في انتظار التحقق
      verified: متصل
      disconnected: غير متصل
    sync_states:
      waiting: في انتظار المزامنة
      queued: المزامنة في قائمة الانتظار
      running: المزامنة قيد التنفيذ
      complete: اكتملت المزامنة
      catching_up: استدراك الطلبات قيد التنفيذ
      failed: فشلت المزامنة
    privacy:
      link: طلبات الخصوصية
      title: طلبات خصوصية Shopify
      instructions: عالج الطلبات خلال 30 يومًا. يجب إرسال ملفات بيانات العملاء بأمان إلى التاجر صاحب الطلب. ويتطلب الاحتفاظ بالسجلات قرارًا قانونيًا موثقًا.
      empty: لا توجد طلبات خصوصية.
      request: "الطلب رقم %{id}"
      request_title: "طلب الخصوصية رقم %{id}"
      due: "الموعد النهائي %{date}"
      secure_response: نزّل ملف البيانات وأرسله بأمان إلى التاجر صاحب الطلب. لا تضع علامة الاكتمال إلا بعد إرساله.
      retained_records: تحتاج الطلبات الجارية أو سجلات العملاء المشتركة إلى مراجعة. عالج الالتزامات التشغيلية وقيّم متطلبات الاحتفاظ بالبيانات، ثم أعد المحاولة. تُحفظ السجلات المالية وحالات الطلبات.
      download: تنزيل ملف البيانات الخاص
      confirm_delivery: تأكيد اكتمال الإرسال الآمن
      retry_redaction: إعادة محاولة محو البيانات
      completed_notice: تم وضع علامة الاكتمال على الطلب.
      retained_alert: عالج السجلات التجارية المحتفظ بها قبل إكمال هذا الطلب.
      queued_notice: تمت إضافة المعالجة إلى قائمة الانتظار.
      topics:
        customers/data_request: طلب بيانات العميل
        customers/redact: محو بيانات العميل
        shop/redact: محو بيانات المتجر
      statuses:
        pending: قيد الانتظار
        needs_review: يحتاج إلى مراجعة
        completed: مكتمل
