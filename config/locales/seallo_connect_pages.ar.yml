      language: "اللغة"
      home: "الصفحة الرئيسية لـ Seallo"
      updated: "آخر تحديث: %{date}"
    footer:
      registration: "التسجيل: %{number}"
      age_note: "Seallo Connect موجّه للمستخدمين التجاريين بعمر 18 سنة فأكثر."
      pricing_note: "Seallo Connect بلا رسوم تطبيق على Shopify. قد تحتاج مساحة عمل Seallo إلى اشتراك Seallo نشط لاستخدام المنصة."
    contact:
      heading: "التواصل"
      with_email: "للدعم أو أسئلة الخصوصية أو طلبات البيانات، راسلونا على"
      without_email: "للدعم أو أسئلة الخصوصية أو طلبات البيانات، تواصلوا مع فريق Seallo من خلال مساحة العمل الخاصة بكم في Seallo."
    overview:
      title: "Seallo Connect"
      summary: "يربط Seallo Connect متجركم على Shopify بمساحة عملكم في Seallo ليتمكن فريقكم من تأكيد وشحن الطلبات بالدفع عند الاستلام."
      sections:
        - heading: "ما الذي يقدمه التطبيق"
          body:
            - "يستورد Seallo Connect الطلبات المؤهلة بالدفع عند الاستلام من متجركم على Shopify إلى مساحة عملكم في Seallo. وهناك يؤكد فريقكم كل طلب عبر الهاتف ويدير المخزون ويجهّز التوصيل مع شركة الشحن."
            - "تصل الطلبات بحالة جديد، وتبقى عمليات التأكيد والمخزون والشحن تحت سيطرة فريقكم في Seallo."
        - heading: "طريقة الربط"
          items:
            - "ثبّتوا Seallo Connect من متجر تطبيقات Shopify ووافقوا على الأذونات المطلوبة."
            - "في التطبيق اختاروا Connect with Seallo. لا توجد خطة Shopify للاختيار."
            - "سجّلوا الدخول إلى Seallo، أكّدوا مساحة العمل لهذا المتجر، ثم ارجعوا إلى Shopify. لا حاجة للنسخ أو اللصق."
        - heading: "الطلبات التي يتم استيرادها"
          body:
            - "الطلبات غير المدفوعة وغير المشحونة بالدفع عند الاستلام، بالدرهم المغربي، والمرسلة إلى المغرب، دون ضرائب أو خصومات. تنقل خطافات الويب الطلبات الجديدة، وتسترجع مزامنة التدارك أي طلبات فاتت. لا يُستورد الطلب نفسه مرتين. أما الطلبات الأخرى فلا تُستورد وتظهر في Seallo كمرفوضة مع بيان السبب."
        - heading: "ما لا يفعله التطبيق"
          items:
            - "لا يعدّل الطلبات أو المنتجات أو العملاء أو المخزون في Shopify."
            - "لا يقرأ عناوين البريد الإلكتروني للعملاء ولا بيانات الدفع."
        - heading: "الأسعار"
          body:
            - "Seallo Connect مجاني على Shopify: بلا رسوم تطبيق أو تجربة أو حصة طلبات Shopify. قد تحتاج مساحة عمل Seallo إلى اشتراك Seallo نشط لأدوات التأكيد والمخزون والشحن."
        - heading: "إلغاء الربط"
          body:
            - "يمكنكم إلغاء الربط من التطبيق أو إزالة تثبيته من Shopify في أي وقت. يتوقف الاستيراد وتُحذف بيانات اعتماد الربط، وتبقى الطلبات المستوردة سابقًا في مساحة عملكم."
    pricing:
      title: "الأسعار"
      summary: "Seallo Connect مجاني على Shopify. تبقى فوترة مساحة عمل Seallo منفصلة."
      sections:
        - heading: "لا رسوم تطبيق على Shopify"
          body:
            - "ليس لـ Seallo Connect اشتراك Shopify منفصل ولا رسوم تطبيق ولا تجربة ولا حصة طلبات Shopify. ربط متجركم لا يضيف بند Seallo على فاتورة Shopify لهذه التكامل."
        - heading: "ما يشمله التكامل المجاني"
          items:
            - "استيراد تلقائي للطلبات المؤهلة بالدفع عند الاستلام، مع مزامنة تدارك."
            - "وصول للقراءة فقط إلى طلبات Shopify لمسار الاستيراد هذا."
            - "لا حصة طلبات Shopify لـ Seallo Connect."
        - heading: "اشتراك مساحة عمل Seallo"
          body:
            - "أدوات التأكيد والمخزون والتوصيل في مساحة عمل Seallo. قد تحتاج تلك المساحة إلى اشتراك Seallo نشط وفق قواعد Morea. تُدار فوترة المساحة في Seallo وليس كخطة Shopify App Pricing لهذا التطبيق."
        - heading: "اشتراكات Shopify المتبقية"
          body:
            - "إن كنتم مشتركين سابقًا في خطة Shopify محذوفة لهذا التطبيق، فقد يظل Shopify يعرضها. إلغاؤها إجراء منفصل في فوترة Shopify."
    privacy:
      title: "سياسة الخصوصية"
      summary: "كيف تتعامل Seallo مع بيانات طلبات Shopify وبيانات إعلانات Meta للتجار."
      sections:
        - heading: "نطاق السياسة"
          body:
            - "Seallo Connect تطبيق Shopify يربط متجر التاجر على Shopify بمساحة عمله في Seallo. يقرر التاجر كيفية التعامل مع طلباته، بينما تعالج Seallo بيانات الطلبات نيابة عنه لتقديم الخدمة."
            - "تشمل هذه السياسة أيضًا الربط الاختياري بإعلانات Meta الموضح أدناه."
        - heading: "بيانات Shopify التي نطّلع عليها"
          body:
            - "بموجب إذن read_orders، نقرأ لكل طلب مؤهل بالدفع عند الاستلام:"
          items:
            - "بيانات تواصل المشتري الواردة في الطلب: اسم الاستلام ورقم الهاتف وعنوان التوصيل (الشارع والمدينة والبلد)."
            - "تفاصيل الطلب: رقمه وتاريخه والعملة والمبالغ والمنتجات والكميات وحالتا الدفع والتنفيذ."
            - "هوية المتجر: نطاق myshopify.com الخاص به، وحالة تثبيت التطبيق."
        - heading: "بيانات Shopify التي لا نطّلع عليها"
          body:
            - "لا نقرأ عناوين البريد الإلكتروني للمشترين ولا بيانات بطاقات الدفع ولا حسابات العملاء ولا بيانات التسويق. لا يطلب التطبيق أذونات على دليل العملاء أو المنتجات، ولا يكتب شيئًا في متجركم على Shopify."
        - heading: "كيف نستخدمها"
          body:
            - "فقط لعرض الطلب على فريق التاجر في Seallo، ولتمكينه من تأكيده مع المشتري وإدارة المخزون وتجهيز التوصيل مع شركة الشحن التي يختارها التاجر. لا نبيع البيانات ولا نستخدمها للإعلانات ولا لتحليل سلوك المشترين."
        - heading: "مكان التخزين ومن يستطيع الاطلاع"
          body:
            - "تُخزَّن الطلبات المستوردة في مساحة عمل التاجر على Seallo ولا يراها إلا من خوّلهم التاجر فيها. المساحات معزولة بعضها عن بعض. تُحفظ بيانات اعتماد وصول التطبيق إلى Shopify في قاعدة بيانات مقيَّدة الوصول تديرها شركة الاستضافة لدينا، وتُحذف عند إزالة تثبيت التطبيق. تستخدم كل الاتصالات HTTPS، وتُوقَّع الطلبات بين Shopify والتطبيق وSeallo وتُتحقق منها تشفيريًا."
        - heading: "مع من نشاركها"
          body:
            - "فقط مع شركة الشحن التي يربطها التاجر لإتمام التوصيل، ومع مزوّدي البنية التحتية اللازمين لاستضافة الخدمة. لا نشاركها مع أي جهة أخرى إلا إذا اقتضى القانون ذلك."
        - heading: "الاحتفاظ والحذف"
          items:
            - "ما دام التطبيق مرتبطًا، تُستورد الطلبات وتُحفظ في مساحة التاجر بوصفها سجلاته التجارية."
            - "عند إزالة التثبيت أو إلغاء الربط يتوقف الاستيراد وتُحذف بيانات اعتماد الربط، كما تُحذف بيانات جلسات Shopify الخاصة بالمتجر. تبقى الطلبات المستوردة في مساحة التاجر حتى يحذفها بنفسه أو ينطبق طلب خصوصية من Shopify."
            - "الطلبات المستوردة عبر Seallo المكتملة (مسلَّمة أو ملغاة أو مُرجَعة) تُحجب منها بيانات تواصل المشتري بعد 180 يومًا عبر مهمة الاحتفاظ في المنصة، مع الإبقاء على المبالغ والحالات وهوية إعادة الاستيراد."
            - "عندما ترسل Shopify طلب حذف بيانات عميل أو متجر، نحجب بيانات تواصل المشتري والملاحظات والأحداث في الطلبات المعنية بعد اكتمالها. أما الطلبات التي لا يزال توصيلها جاريًا فتُحفظ وتُعرض على التاجر للمراجعة حتى اكتمالها كي لا تتعطل عمليات التسليم. وتُحفظ المبالغ والحالات والمعرّفات اللازمة للمحاسبة ولمنع إعادة الاستيراد."
        - heading: "إعلانات Meta"
          body:
            - "عندما تمنح إذن الربط بإعلانات Meta، تعرض Seallo الحسابات الإعلانية التي يمكنك ربطها. تقرأ Seallo اسم الحساب وعملته ومنطقته الزمنية وحالته. وللحسابات التي تربطها، تقرأ Seallo أسماء الحملات والمجموعات الإعلانية والإعلانات وتفاصيلها، والإنفاق اليومي، والنتائج التي تبلغ عنها Meta مثل مرات الظهور والنقرات وعمليات الشراء المنسوبة إلى الإعلانات."
            - "تستخدم Seallo هذه البيانات في مساحة عملك لعرض تكاليف الإعلانات وإدراجها في حساب ربحية المنتجات. الوصول إلى الإعلانات للقراءة فقط. تحفظ Seallo رمز الوصول إلى Meta مشفّرًا لمزامنة الحسابات المرتبطة."
            - "لإيقاف المزامنة، افتح إعلانات Meta في مساحة عملك على Seallo واختر قطع الاتصال. تحذف Seallo رمز الوصول وتلغي ربط الحسابات وتطلب من Meta إلغاء الأذونات. يمكنك أيضًا طلب حذف بياناتك عبر Meta. عندما ترسل Meta الطلب، تحذف Seallo رمز الوصول ومعرّف مستخدم Meta من الاتصالات المعنية وتوقف المزامنة. وتحتفظ Seallo ببصمة رقمية للمعرّف لتوثيق الحذف. يبقى الإنفاق الذي سبق أن تمت مزامنته في مساحة عمل التاجر ضمن سجلاته التجارية."
        - heading: "ملفات تعريف الارتباط"
          body:
            - "تستخدم هذه الصفحات العامة ملفًا ضروريًا لتذكّر اللغة. ولا تُحمَّل وحدات Meta أو TikTok. قد تُحمَّل الخطوط من Google Fonts. راجعي سياسة الكوكيز للتفاصيل والخيارات."
        - heading: "طلبات الخصوصية من المشترين"
          body:
            - "على المشترين التواصل مع التاجر الذي اشتروا منه. وعندما تحيل Shopify طلب الاطلاع على بيانات عميل، نُعدّ تصديرًا لبيانات الطلبات المستوردة الخاصة به ليراجعه التاجر ويسلّمه. ويمكن للتجار وغيرهم استخدام نموذج الحقوق المرتبط من هذا الموقع، أو مراسلتنا على العنوان أدناه."
        - heading: "الأمان"
          body:
            - "يُتحقق من طلبات Shopify بتوقيعها، وتستخدم الطلبات بين الخوادم مفتاح توقيع منفصلًا ونافذة زمنية قصيرة لمنع التزوير وإعادة الإرسال. ويقتصر الوصول إلى بيانات أي مساحة عمل على أعضائها المخوَّلين."
        - heading: "التغييرات"
          body:
            - "سنحدّث هذه الصفحة وتاريخها عند تغيّر ممارساتنا."
    terms:
      title: "شروط الخدمة"
      summary: "شروط استخدام Seallo Connect مع متجركم على Shopify."
      sections:
        - heading: "الخدمة"
          body:
            - "يستورد Seallo Connect الطلبات المؤهلة بالدفع عند الاستلام من متجركم على Shopify إلى مساحة عملكم في Seallo. بتثبيت التطبيق أو استخدامه فإنكم توافقون على هذه الشروط وعلى سياسة الخصوصية."
        - heading: "حسابكم وصلاحياتكم"
          body:
            - "يجب أن تكونوا مخوَّلين بتثبيت التطبيقات على متجر Shopify وربطه بمساحة العمل التي تختارونها في Seallo. لا يمكن ربط المتجر إلا بمساحة عمل واحدة في كل مرة. حافظوا على سرية رموز الربط، فهي تُستخدم مرة واحدة وتنتهي صلاحيتها."
        - heading: "الاشتراك والفوترة"
          body:
            - "ليس لـ Seallo Connect رسوم تطبيق Shopify ولا حصة طلبات Shopify. قد تحتاج مساحة عمل Seallo إلى اشتراك Seallo نشط لاستخدام المنصة. تُدار فوترة المساحة في Seallo وفق شروطها."
        - heading: "مسؤولياتكم"
          items:
            - "استخدام الخدمة بصورة قانونية ولطلبات متجركم وحده."
            - "إعلام مشتريكم بكيفية استخدام بياناتهم ومعالجتها قانونيًا، بما في ذلك مكالمات التأكيد وعمليات التوصيل."
            - "مراجعة الطلبات المستوردة. تظلون مسؤولين عن تأكيدها وشحنها وتنفيذها."
        - heading: "التوفر"
          body:
            - "نعمل على جعل الاستيراد موثوقًا عبر خطافات الويب ومزامنة التدارك، لكننا لا نضمن خدمة دون انقطاع. قد تؤخر أعطال Shopify أو شركات الشحن الاستيراد. راجعوا حالة الربط في التطبيق وفي Seallo."
        - heading: "إنهاء الخدمة"
          body:
            - "يمكنكم إلغاء الربط أو إزالة التثبيت في أي وقت. ويجوز لنا تعليق ربط يخالف هذه الشروط أو يعرّض المنصة للخطر. تبقى الطلبات المستوردة في مساحة عملكم وفق سياسة الخصوصية."
        - heading: "المسؤولية"
          body:
            - "تُقدَّم الخدمة كما هي، بالقدر الذي يسمح به القانون. لا نتحمل الخسائر غير المباشرة كفوات المبيعات، ولا التأخير أو الإخفاق الناتج عن Shopify أو شركات الشحن أو أطراف ثالثة أخرى."
        - heading: "التغييرات"
          body:
            - "قد نحدّث هذه الشروط، ويبيّن التاريخ في أعلى الصفحة آخر نسخة. ويعني استمراركم في الاستخدام بعد التغيير قبولكم له."
    cookie_policy:
      title: "سياسة ملفات تعريف الارتباط"
      summary: "كيف تستخدم صفحات Seallo Connect العامة ملفات تعريف الارتباط والتقنيات المشابهة."
      sections:
        - heading: "الملفات الضرورية"
          body:
            - "ملف لغة يتذكّر اختيار FR أو EN أو AR على هذه الصفحات لتبقى الزيارة التالية بنفس اللغة. وهو لازم لعمل الموقع كما ضبطتِه."
        - heading: "ملفات القياس"
          body:
            - "هذه الصفحات لا تحمّل Meta Pixel أو TikTok Pixel أو أي سكربت قياس جمهور. إذا زرتِ لاحقًا واجهة متجر على هذه المنصة، فلتلك الواجهة شريط موافقة خاص ولا يُحمَّل القياس إلا بعد القبول."
        - heading: "الخطوط والأطراف الثالثة"
          body:
            - "قد تُحمَّل خطوط الصفحة من Google Fonts، فيذهب الطلب إلى خوادم Google. انظري أيضًا سياسة الخصوصية وجرد الأطراف الثالثة في وثائق المنتج."
        - heading: "خياراتك"
          body:
            - "استخدمي قبول أو رفض القياس في الشريط. الملفات الضرورية تبقى تعمل عند الرفض. يمكنكِ مسح ملفات الموقع من المتصفح في أي وقت."
    refunds:
      title: "الاسترداد والإلغاء"
      summary: "كيف تعمل الفوترة والإلغاء بعد أن أصبح Seallo Connect بلا رسوم تطبيق على Shopify."
      sections:
        - heading: "من يفوترك"
          body:
            - "لا يفرض Seallo Connect رسومًا عبر Shopify App Pricing. إن دفعتم اشتراك مساحة عمل Seallo، فتلك الفوترة تتم في Seallo وليست كرسم Shopify لهذا التطبيق."
        - heading: "الإلغاء"
          body:
            - "ألغوا الربط أو أزيلوا تثبيت Seallo Connect من Shopify في أي وقت. يتوقف الاستيراد. تبقى الطلبات المستوردة في مساحة Seallo. إن ظهر اشتراك Shopify متبقٍ لخطة محذوفة، ألغوه من فوترة Shopify."
        - heading: "الاسترداد"
          body:
            - "لا توجد رسوم تطبيق Shopify حالية لـ Seallo Connect. استرداد أي رسوم Shopify تاريخية يتبع سياسات Shopify. لأسئلة فوترة مساحة Seallo استخدموا بيانات التواصل في هذه الصفحات أو مساحة عملكم."
        - heading: "بدون رسوم مخفية"
          body:
            - "لا يضيف Seallo Connect رسوم تطبيق Shopify. رسوم الشحن أو متجر Shopify أو اشتراك مساحة Seallo منفصلة."
    privacy_rights:
      title: "حقوق بياناتك"
      summary: "اطلبي الوصول أو التصحيح أو الاعتراض أو الحذف أو إيقاف التسويق المتعلق بـ Seallo Connect أو مشغّل المنصة."
      unsubscribe_note: "لا يرسل Seallo Connect حملات بريد تسويقية من هذه الصفحات. اختاري «إيقاف التسويق» لتسجيل تفضيل أو إذا وصلتك رسالة ترويجية عن التطبيق عبر قناة أخرى."
      minimization: "قدّمي فقط ما يلزم لتعريف طلبك. لا ترسلي كلمات مرور أو أرقام بطاقات."
      submit: "إرسال الطلب"
      submitted: "تم تسجيل طلبك. سنتابع معك عبر وسيلة التواصل التي قدّمتها."
      fields:
        type: "نوع الطلب"
        name: "الاسم"
        contact: "البريد أو الهاتف"
        contact_help: "كيف نتواصل معك بخصوص هذا الطلب."
        shop_domain: "نطاق متجر Shopify (اختياري)"
        details: "تفاصيل (اختياري)"
      types:
