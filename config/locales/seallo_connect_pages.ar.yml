      language: "اللغة"
      home: "الصفحة الرئيسية لـ Seallo"
      updated: "آخر تحديث: %{date}"
    contact:
      heading: "التواصل"
      with_email: "للدعم أو أسئلة الخصوصية أو طلبات البيانات، راسلونا على"
      without_email: "للدعم أو أسئلة الخصوصية أو طلبات البيانات، تواصلوا مع فريق Seallo من خلال مساحة العمل الخاصة بكم في Seallo."
    overview:
      title: "Seallo Connect"
      summary: "يربط Seallo Connect متجركم على Shopify بمساحة عملكم في Seallo ليتمكن فريقكم من تأكيد وشحن الطلبات بالدفع عند الاستلام."
      sections:
        - heading: "ما الذي يقدمه التطبيق"
          body:
            - "يستورد Seallo Connect الطلبات المؤهلة بالدفع عند الاستلام من متجركم على Shopify إلى مساحة عملكم في Seallo. وهناك يؤكد فريقكم كل طلب عبر الهاتف ويدير المخزون ويجهّز التوصيل مع شركة الشحن."
            - "تصل الطلبات بحالة جديد، وتبقى عمليات التأكيد والمخزون والشحن تحت سيطرة فريقكم في Seallo."
        - heading: "طريقة الربط"
          items:
            - "ثبّتوا Seallo Connect من متجر تطبيقات Shopify ووافقوا على الأذونات المطلوبة."
            - "اختاروا خطة من صفحة الأسعار على Shopify."
            - "في مساحة عملكم على Seallo، افتحوا صفحة ربط Seallo وأنشئوا رمز ربط يُستخدم مرة واحدة. لا يستطيع ذلك إلا شخص مخوَّل في تلك المساحة."
            - "الصقوا الرمز في التطبيق داخل لوحة إدارة Shopify خلال 10 دقائق."
        - heading: "الطلبات التي يتم استيرادها"
          body:
            - "الطلبات غير المدفوعة وغير المشحونة بالدفع عند الاستلام، بالدرهم المغربي، والمرسلة إلى المغرب، دون ضرائب أو خصومات. تنقل خطافات الويب الطلبات الجديدة، وتسترجع مزامنة التدارك أي طلبات فاتت. لا يُستورد الطلب نفسه مرتين. أما الطلبات الأخرى فلا تُستورد وتظهر في Seallo كمرفوضة مع بيان السبب."
        - heading: "ما لا يفعله التطبيق"
          items:
            - "لا يعدّل الطلبات أو المنتجات أو العملاء أو المخزون في Shopify."
            - "لا يقرأ عناوين البريد الإلكتروني للعملاء ولا بيانات الدفع."
        - heading: "الخطط"
          body:
            - "تُباع الخطط وتُفوتر عبر Shopify مع فترة تجريبية مدتها 7 أيام: الأساسية (30 طلبًا مستوردًا في كل دورة فوترة) والاحترافية (100) والمتميزة (غير محدودة). تظهر الأسعار الحالية في صفحة الأسعار على Shopify. لا تُحتسب الطلبات المعاد إرسالها أو المرفوضة من حصتكم، ويُستأنف الاستيراد المتوقف عند بلوغ الحد بعد الترقية."
        - heading: "إلغاء الربط"
          body:
            - "يمكنكم إلغاء الربط من التطبيق أو إزالة تثبيته من Shopify في أي وقت. يتوقف الاستيراد وتُحذف بيانات اعتماد الربط، وتبقى الطلبات المستوردة سابقًا في مساحة عملكم."
    pricing:
      title: "الأسعار"
      summary: "خطط شهرية بسيطة تُفوتر عبر Shopify، ولكل منها فترة تجريبية مجانية مدتها 7 أيام."
      sections:
        - heading: "Seallo الأساسية: 9 دولارات شهريًا"
          body:
            - "حتى 30 طلبًا مستوردًا في كل دورة فوترة."
        - heading: "Seallo الاحترافية: 25 دولارًا شهريًا"
          body:
            - "حتى 100 طلب مستورد في كل دورة فوترة."
        - heading: "Seallo المتميزة: 50 دولارًا شهريًا"
          body:
            - "عدد غير محدود من الطلبات المستوردة."
        - heading: "ما تشمله كل خطة"
          items:
            - "فترة تجريبية مجانية مدتها 7 أيام."
            - "استيراد تلقائي للطلبات المؤهلة بالدفع عند الاستلام، مع مزامنة تدارك لما فاتها."
            - "أدوات التأكيد والمخزون والتوصيل في مساحة عملكم المرتبطة على Seallo، دون الحاجة إلى شراء ثانٍ لهذا الربط."
            - "وصول للقراءة فقط إلى طلباتكم على Shopify."
        - heading: "كيف تعمل حصة الطلبات"
          body:
            - "لا تُحتسب من حصتكم إلا الطلبات المستوردة بنجاح. أما الطلبات المرفوضة أو المستوردة سابقًا فلا تُحتسب. عند بلوغ الحد يتوقف الاستيراد حتى دورة الفوترة التالية أو حتى الترقية، ولا يُحذف أي شيء تم استيراده."
        - heading: "الفوترة"
          body:
            - "الأسعار بالدولار الأمريكي وتُفوتر شهريًا عبر Shopify، وتظهر الرسوم في فاتورتكم على Shopify. يمكنكم اختيار الخطة أو تغييرها أو إلغاؤها من التطبيق داخل لوحة إدارة Shopify. لا تُحتسب رسوم على متاجر التطوير. وتعرض صفحة الأسعار على Shopify دائمًا السعر الحالي."
    privacy:
      title: "سياسة الخصوصية"
      summary: "كيف يعالج Seallo Connect بيانات المتجر والطلبات نيابة عن التجار."
      sections:
        - heading: "نطاق السياسة"
          body:
            - "Seallo Connect تطبيق Shopify يربط متجر التاجر على Shopify بمساحة عمله في Seallo. يقرر التاجر كيفية التعامل مع طلباته، بينما تعالج Seallo بيانات الطلبات نيابة عنه لتقديم الخدمة."
        - heading: "البيانات التي نطّلع عليها"
          body:
            - "بموجب إذن read_orders، نقرأ لكل طلب مؤهل بالدفع عند الاستلام:"
          items:
            - "بيانات تواصل المشتري الواردة في الطلب: اسم الاستلام ورقم الهاتف وعنوان التوصيل (الشارع والمدينة والبلد)."
            - "تفاصيل الطلب: رقمه وتاريخه والعملة والمبالغ والمنتجات والكميات وحالتا الدفع والتنفيذ."
            - "هوية المتجر: نطاق myshopify.com الخاص به، وحالة تثبيت التطبيق واشتراكه."
        - heading: "البيانات التي لا نطّلع عليها"
          body:
            - "لا نقرأ عناوين البريد الإلكتروني للمشترين ولا بيانات بطاقات الدفع ولا حسابات العملاء ولا بيانات التسويق. لا يطلب التطبيق أذونات على دليل العملاء أو المنتجات، ولا يكتب شيئًا في متجركم على Shopify."
        - heading: "كيف نستخدمها"
          body:
            - "فقط لعرض الطلب على فريق التاجر في Seallo، ولتمكينه من تأكيده مع المشتري وإدارة المخزون وتجهيز التوصيل مع شركة الشحن التي يختارها التاجر. لا نبيع البيانات ولا نستخدمها للإعلانات ولا لتحليل سلوك المشترين."
        - heading: "مكان التخزين ومن يستطيع الاطلاع"
          body:
            - "تُخزَّن الطلبات المستوردة في مساحة عمل التاجر على Seallo ولا يراها إلا من خوّلهم التاجر فيها. المساحات معزولة بعضها عن بعض. تُحفظ بيانات اعتماد وصول التطبيق إلى Shopify في قاعدة بيانات مقيَّدة الوصول تديرها شركة الاستضافة لدينا، وتُحذف عند إزالة تثبيت التطبيق. تستخدم كل الاتصالات HTTPS، وتُوقَّع الطلبات بين Shopify والتطبيق وSeallo وتُتحقق منها تشفيريًا."
        - heading: "مع من نشاركها"
          body:
            - "فقط مع شركة الشحن التي يربطها التاجر لإتمام التوصيل، ومع مزوّدي البنية التحتية اللازمين لاستضافة الخدمة. لا نشاركها مع أي جهة أخرى إلا إذا اقتضى القانون ذلك."
        - heading: "الاحتفاظ والحذف"
          items:
            - "ما دام التطبيق مرتبطًا، تُستورد الطلبات وتُحفظ في مساحة التاجر بوصفها سجلاته التجارية."
            - "عند إزالة التثبيت أو إلغاء الربط يتوقف الاستيراد وتُحذف بيانات اعتماد الربط، كما تُحذف بيانات جلسات Shopify الخاصة بالمتجر. تبقى الطلبات المستوردة في مساحة التاجر حتى يحذفها بنفسه أو ينطبق طلب خصوصية من Shopify."
            - "عندما ترسل Shopify طلب حذف بيانات عميل أو متجر، نحجب بيانات تواصل المشتري والملاحظات والأحداث في الطلبات المعنية بعد اكتمالها. أما الطلبات التي لا يزال توصيلها جاريًا فتُحفظ وتُعرض على التاجر للمراجعة حتى اكتمالها كي لا تتعطل عمليات التسليم. وتُحفظ المبالغ والحالات والمعرّفات اللازمة للمحاسبة ولمنع إعادة الاستيراد."
        - heading: "طلبات الخصوصية من المشترين"
          body:
            - "على المشترين التواصل مع التاجر الذي اشتروا منه. وعندما تحيل Shopify طلب الاطلاع على بيانات عميل، نُعدّ تصديرًا لبيانات الطلبات المستوردة الخاصة به ليراجعه التاجر ويسلّمه. ويمكن للمشترين والتجار أيضًا مراسلتنا على العنوان أدناه."
        - heading: "الأمان"
          body:
            - "يُتحقق من طلبات Shopify بتوقيعها، وتستخدم الطلبات بين الخوادم مفتاح توقيع منفصلًا ونافذة زمنية قصيرة لمنع التزوير وإعادة الإرسال. ويقتصر الوصول إلى بيانات أي مساحة عمل على أعضائها المخوَّلين."
        - heading: "التغييرات"
          body:
            - "سنحدّث هذه الصفحة وتاريخها عند تغيّر ممارساتنا."
    terms:
      title: "شروط الخدمة"
      summary: "شروط استخدام Seallo Connect مع متجركم على Shopify."
      sections:
        - heading: "الخدمة"
          body:
            - "يستورد Seallo Connect الطلبات المؤهلة بالدفع عند الاستلام من متجركم على Shopify إلى مساحة عملكم في Seallo. بتثبيت التطبيق أو استخدامه فإنكم توافقون على هذه الشروط وعلى سياسة الخصوصية."
        - heading: "حسابكم وصلاحياتكم"
          body:
            - "يجب أن تكونوا مخوَّلين بتثبيت التطبيقات على متجر Shopify وربطه بمساحة العمل التي تختارونها في Seallo. لا يمكن ربط المتجر إلا بمساحة عمل واحدة في كل مرة. حافظوا على سرية رموز الربط، فهي تُستخدم مرة واحدة وتنتهي صلاحيتها."
        - heading: "الاشتراك والفوترة"
          body:
            - "يُقدَّم Seallo Connect عبر خطط تديرها Shopify مع فترة تجريبية. تتولى Shopify الفوترة وتغيير الخطط والإلغاء وفق شروطها. تتضمن كل خطة عددًا من الطلبات المستوردة في كل دورة فوترة، وعند بلوغه يتوقف الاستيراد حتى الدورة التالية أو حتى الترقية. تُحفظ الطلبات المستوردة سابقًا."
        - heading: "مسؤولياتكم"
          items:
            - "استخدام الخدمة بصورة قانونية ولطلبات متجركم وحده."
            - "إعلام مشتريكم بكيفية استخدام بياناتهم ومعالجتها قانونيًا، بما في ذلك مكالمات التأكيد وعمليات التوصيل."
            - "مراجعة الطلبات المستوردة. تظلون مسؤولين عن تأكيدها وشحنها وتنفيذها."
        - heading: "التوفر"
          body:
            - "نعمل على جعل الاستيراد موثوقًا عبر خطافات الويب ومزامنة التدارك، لكننا لا نضمن خدمة دون انقطاع. قد تؤخر أعطال Shopify أو شركات الشحن الاستيراد. راجعوا حالة الربط في التطبيق وفي Seallo."
        - heading: "إنهاء الخدمة"
          body:
            - "يمكنكم إلغاء الربط أو إزالة التثبيت في أي وقت. ويجوز لنا تعليق ربط يخالف هذه الشروط أو يعرّض المنصة للخطر. تبقى الطلبات المستوردة في مساحة عملكم وفق سياسة الخصوصية."
        - heading: "المسؤولية"
          body:
            - "تُقدَّم الخدمة كما هي، بالقدر الذي يسمح به القانون. لا نتحمل الخسائر غير المباشرة كفوات المبيعات، ولا التأخير أو الإخفاق الناتج عن Shopify أو شركات الشحن أو أطراف ثالثة أخرى."
        - heading: "التغييرات"
          body:
            - "قد نحدّث هذه الشروط، ويبيّن التاريخ في أعلى الصفحة آخر نسخة. ويعني استمراركم في الاستخدام بعد التغيير قبولكم له."
