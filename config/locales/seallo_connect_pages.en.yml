      age_note: "Seallo Connect is intended for business users aged 18 or older."
      pricing_note: "Plan prices are shown on the pricing page and billed by Shopify. There are no hidden app fees beyond your chosen plan."
    contact:
      heading: "Contact"
      with_email: "For support, privacy questions or data requests, email"
      without_email: "For support, privacy questions or data requests, contact the Seallo team through your Seallo workspace."
    overview:
      title: "Seallo Connect"
      summary: "Seallo Connect links your Shopify store to your Seallo workspace so your team can confirm and ship cash-on-delivery orders."
      sections:
        - heading: "What it does"
          body:
            - "Seallo Connect imports eligible cash-on-delivery orders from your Shopify store into your Seallo workspace. There your team confirms each order by phone, manages stock and prepares the delivery with your carrier."
            - "Orders arrive as New. Confirmation, inventory and shipping stay under your team's control in Seallo."
        - heading: "How to connect"
          items:
            - "Install Seallo Connect from the Shopify App Store and approve the requested access."
            - "Choose a plan on Shopify's pricing page."
            - "In your Seallo workspace, open the Seallo connection page and generate a one-time connection code. Only someone authorised in that workspace can do this."
            - "Paste the code in the app inside your Shopify admin within 10 minutes."
        - heading: "Which orders are imported"
          body:
            - "Unpaid, unfulfilled cash-on-delivery orders in MAD, shipping to Morocco, without tax or discounts. Webhooks deliver new orders, and a catch-up sync recovers any that were missed. The same order is never imported twice. Other orders are not imported and appear as rejected, with a reason, in Seallo."
        - heading: "What it does not do"
          items:
            - "It does not change orders, products, customers or inventory in Shopify."
            - "It does not read customer email addresses or payment details."
        - heading: "Plans"
          body:
            - "Plans are managed through Shopify: Starter is $19 per month, Intermediate is $39 per month, Professionnel is $59 per month, and Business is $129 per month with unlimited imported orders. Current prices are shown on Shopify's pricing page. Replayed and rejected orders do not use your allowance, and imports that reach the limit resume after you upgrade."
        - heading: "Disconnecting"
          body:
            - "You can disconnect from the app or uninstall it from Shopify at any time. Importing stops and the connection credentials are removed. Orders already imported remain in your workspace."
    pricing:
      title: "Pricing"
      summary: "Simple paid monthly plans managed through Shopify."
      sections:
        - heading: "Seallo Starter: $19 per month"
        - heading: "Seallo Intermediate: $39 per month"
        - heading: "Seallo Professionnel: $59 per month"
        - heading: "Seallo Business: $129 per month"
          body:
            - "Unlimited imported orders."
        - heading: "What every plan includes"
          items:
            - "A 7-day free trial on paid plans."
            - "Automatic import of eligible cash-on-delivery orders, plus a catch-up sync for any that were missed."
            - "Order confirmation, stock and delivery tools in your connected Seallo workspace, with no second purchase needed for this connection."
            - "Read-only access to your Shopify orders."
        - heading: "How the order allowance works"
          body:
            - "Only orders that are successfully imported count toward your allowance. Orders that are rejected, or that were already imported, do not. When you reach your limit, importing pauses until the next billing cycle or until you upgrade, and nothing already imported is removed."
        - heading: "Billing"
          body:
            - "Prices are in US dollars and billed monthly by Shopify, and charges appear on your Shopify invoice. Choose, change or cancel your plan from the app in your Shopify admin. Development stores are not charged. Shopify's pricing page always shows the current price."
    privacy:
      title: "Privacy policy"
      summary: "How Seallo handles Shopify order data and Meta Ads data for merchants."
      sections:
        - heading: "Who this applies to"
          body:
            - "Seallo Connect is a Shopify app that connects a merchant's Shopify store to the merchant's workspace in Seallo. The merchant decides how its orders are handled. Seallo processes order data on the merchant's behalf to provide the service."
            - "This policy also covers the optional Meta Ads connection described below."
        - heading: "Shopify data we access"
          body:
            - "With the read_orders permission, for each eligible cash-on-delivery order, we read:"
          items:
            - "Buyer contact details from the order: shipping name, phone number and delivery address (street, city, country)."
            - "Order details: order number, date, currency, amounts, items, quantities, payment and fulfilment status."
            - "Shop identity: the store's myshopify.com domain, and the app's installation and subscription status."
        - heading: "Shopify data we do not access"
          body:
            - "We do not read buyer email addresses, payment card details, customer accounts or marketing data. The app does not request customer-directory or product permissions, and does not write to your Shopify store."
        - heading: "How we use it"
          body:
            - "Only to show the order to the merchant's team in Seallo, let them confirm it with the buyer, manage stock, and prepare delivery with the carrier the merchant chooses. We do not sell data, use it for advertising or use it to profile buyers."
        - heading: "Where it is stored and who can see it"
          body:
            - "Imported orders are stored in the merchant's Seallo workspace and are visible only to people the merchant has authorised there. Workspaces are isolated from each other. The app's Shopify access credentials are kept in an access-controlled database run by our hosting provider and are deleted when the app is uninstalled. All communication uses HTTPS, and requests between Shopify, the app and Seallo are cryptographically signed and verified."
        - heading: "Who we share it with"
          body:
            - "Only with the delivery carrier the merchant connects, so that parcels can be delivered, and with infrastructure providers needed to host the service. We do not share it with anyone else, except where the law requires."
        - heading: "Retention and deletion"
          items:
            - "While the app is connected, orders are imported and kept in the merchant's workspace as its business records."
            - "When the app is uninstalled or disconnected, importing stops and connection credentials are removed. Shopify session data for the shop is deleted. Orders already imported stay in the merchant's workspace until the merchant deletes them or a Shopify privacy request applies."
            - "Completed Seallo-imported orders (delivered, cancelled or returned) have buyer contact details redacted after 180 days under the platform retention job, while amounts, statuses and replay identity are kept."
            - "When Shopify sends a customer redaction or shop redaction request, we redact buyer contact details, notes and events on the affected orders once they are completed. Orders still being delivered are held, and flagged for the merchant to review, until they are completed, so that deliveries are not broken. Amounts, statuses and identifiers needed for accounting and to prevent re-importing are kept."
        - heading: "Meta Ads"
          body:
            - "When you authorize Meta Ads, Seallo lists the ad accounts you can connect. Seallo reads the account name, currency, time zone and status. For accounts you link, Seallo reads campaign, ad set and ad names and details, daily spend, and results reported by Meta, such as impressions, clicks and attributed purchases."
            - "Seallo uses these data in your workspace to report advertising costs and include them in product profitability. The connection is read-only for ads. Seallo stores the Meta access token encrypted so it can sync your linked accounts."
            - "To stop syncing, open Meta Ads in your Seallo workspace and select Disconnect. Seallo removes the access token, unlinks the accounts and asks Meta to revoke the permissions. You can also request deletion through Meta. When Meta sends the request, Seallo removes the access token and Meta user ID from the affected connections and stops syncing. Seallo keeps a hashed identifier to record the deletion. Spend already synced stays in the merchant's workspace as part of its business records."
        - heading: "Cookies"
          body:
            - "These public pages use a necessary cookie to remember your language choice. They do not load Meta or TikTok measurement pixels. Fonts may be loaded from Google Fonts. See the cookie policy for details and choices."
        - heading: "Privacy requests from buyers"
          body:
            - "Buyers should contact the merchant they bought from. When Shopify forwards a customer data request, we prepare an export of the imported order data about that customer for the merchant to review and provide. Merchants and other requesters can also use the data-rights form linked from this site, or write to us at the address below."
        - heading: "Security"
          body:
            - "Requests from Shopify are verified with Shopify's signature, and server-to-server requests use a separate signed key with a short time window to prevent forgery and replay. Access to a workspace's data is limited to authorised members of that workspace."
        - heading: "Changes"
          body:
            - "We will update this page and its date when our practices change."
    terms:
      title: "Terms of service"
      summary: "The terms for using Seallo Connect with your Shopify store."
      sections:
        - heading: "The service"
          body:
            - "Seallo Connect imports eligible cash-on-delivery orders from your Shopify store into your Seallo workspace. By installing or using the app you agree to these terms and to the privacy policy."
        - heading: "Your account and authority"
          body:
            - "You must be authorised to install apps on the Shopify store and to connect it to the Seallo workspace you choose. A store can be linked to one workspace at a time. Keep your connection codes private. They are single-use and expire."
        - heading: "Subscription and billing"
          body:
            - "Seallo Connect is offered through Shopify-managed paid plans, with a trial period on paid plans. Billing, plan changes and cancellation are handled by Shopify under its terms. Each plan includes a number of imported orders per billing cycle. When it is reached, importing pauses until the next cycle or until you upgrade. Orders already imported are preserved."
        - heading: "Your responsibilities"
          items:
            - "Use the service lawfully and only for your own store's orders."
            - "Inform your buyers how their data is used, and handle their data lawfully, including confirmation calls and deliveries."
            - "Review imported orders. You remain responsible for confirming, shipping and fulfilling them."
        - heading: "Availability"
          body:
            - "We work to keep imports reliable, with webhooks and a catch-up sync, but we cannot guarantee uninterrupted service. Shopify or carrier outages may delay imports. Check the connection status in the app and in Seallo."
        - heading: "Ending the service"
          body:
            - "You can disconnect or uninstall at any time. We may suspend a connection that breaks these terms or puts the platform at risk. Imported orders remain in your workspace, subject to the privacy policy."
        - heading: "Liability"
          body:
            - "The service is provided as is, to the extent allowed by law. We are not liable for indirect losses, such as lost sales, or for delays or failures caused by Shopify, carriers or other third parties."
        - heading: "Changes"
          body:
            - "We may update these terms. The date at the top shows the latest version. Continued use after a change means you accept it."
    cookie_policy:
      title: "Cookie policy"
      summary: "How Seallo Connect public pages use cookies and similar technologies."
      sections:
        - heading: "Necessary cookies"
          body:
            - "A language cookie remembers the FR, EN or AR choice you make on these pages so the next visit stays in that language. It is required for the site to work as you configured it."
        - heading: "Measurement cookies"
          body:
            - "These Seallo Connect pages do not load Meta Pixel, TikTok Pixel or other audience-measurement scripts. If you later visit a merchant storefront on this platform, that storefront has its own cookie banner and may load measurement only after you accept."
        - heading: "Fonts and third parties"
          body:
            - "Page fonts may be loaded from Google Fonts. That request goes to Google’s servers. See also our privacy policy and the third-party inventory in the product documentation."
        - heading: "Your choices"
          body:
            - "Use Accept or Reject measurement on the banner. Necessary cookies still work if you reject. You can clear site cookies in your browser at any time."
    refunds:
      title: "Refunds and cancellations"
      summary: "How billing, cancellations and refunds work for Seallo Connect plans."
      sections:
        - heading: "Who bills you"
          body:
            - "Seallo Connect plans are sold and billed by Shopify on your Shopify invoice. Charges appear in US dollars under Shopify’s billing terms."
        - heading: "Cancelling"
          body:
            - "Change or cancel your plan from the Seallo Connect app in your Shopify admin. Cancelling stops future charges at the end of the current Shopify billing period for that subscription. Orders already imported stay in your Seallo workspace."
        - heading: "Refunds"
          body:
            - "Refunds for Shopify app charges follow Shopify’s refund policies and processes. Contact Shopify billing support for charge disputes on your Shopify invoice. For questions about the Seallo Connect service itself, use the contact details on these pages or the data-rights form."
        - heading: "Trials"
          body:
            - "Paid plans include a 7-day free trial where Shopify offers it. Development stores are not charged."
        - heading: "No hidden fees"
          body:
            - "There are no additional Seallo Connect fees beyond the plan price shown on the pricing page and charged by Shopify. Carrier, Shopify or other third-party fees are separate."
    privacy_rights:
      title: "Your data rights"
      summary: "Request access, correction, objection, deletion or a marketing opt-out related to Seallo Connect or the platform operator."
      unsubscribe_note: "Seallo Connect does not send marketing email campaigns from these pages. Choose “Stop marketing” to record a preference or if you received a promotional message about the app by another channel."
      minimization: "Provide only what we need to identify your request. Do not send passwords or payment card numbers."
      submit: "Send request"
      submitted: "Your request was recorded. We will follow up using the contact you provided."
      fields:
