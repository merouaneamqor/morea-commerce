        name: "Your name"
        contact: "Email or phone"
        contact_help: "How we should reach you about this request."
        shop_domain: "Shopify shop domain (optional)"
        details: "Details (optional)"
      types:
        access: "Access my data"
        rectify: "Correct my data"
        object: "Object to processing"
        delete: "Delete my data"
        unsubscribe: "Stop marketing"
      statuses:
        open: "Open"
        in_progress: "In progress"
        resolved: "Resolved"
        rejected: "Rejected"
      admin:
        title: "Platform data-rights requests"
        instructions: "Requests from Seallo Connect public pages. Resolve them after you have answered the requester."
        empty: "No requests yet."
        back: "Back to requests"
        resolve: "Mark resolved"
        resolved: "Request marked resolved."
