      summary: Request access, correction, objection, deletion or a marketing opt-out related to Seallo Connect or the platform
        operator.
      unsubscribe_note: Seallo Connect does not send marketing email campaigns from these pages. Choose “Stop marketing” to
        record a preference or if you received a promotional message about the app by another channel.
      minimization: Provide only what we need to identify your request. Do not send passwords or payment card numbers.
      submit: Send request
      submitted: Your request was recorded. We will follow up using the contact you provided.
      fields:
        type: Request type
        name: Your name
        contact: Email or phone
        contact_help: How we should reach you about this request.
        shop_domain: Shopify shop domain (optional)
        details: Details (optional)
      types:
        access: Access my data
        rectify: Correct my data
        object: Object to processing
        delete: Delete my data
        unsubscribe: Stop marketing
