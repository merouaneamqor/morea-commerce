        name: "Votre nom"
        contact: "E-mail ou téléphone"
        contact_help: "Comment nous joindre pour cette demande."
        shop_domain: "Domaine boutique Shopify (optionnel)"
        details: "Détails (optionnel)"
      types:
        access: "Accéder à mes données"
        rectify: "Corriger mes données"
        object: "M’opposer au traitement"
        delete: "Supprimer mes données"
        unsubscribe: "Arrêter le marketing"
