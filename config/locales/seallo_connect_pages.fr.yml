    contact:
      heading: "Contact"
      with_email: "Pour toute demande d'assistance, question sur la confidentialité ou demande relative aux données, écrivez à"
      without_email: "Pour toute demande d'assistance, question sur la confidentialité ou demande relative aux données, contactez l'équipe Seallo depuis votre espace Seallo."
    overview:
      title: "Seallo Connect"
      summary: "Seallo Connect relie votre boutique Shopify à votre espace Seallo afin que votre équipe confirme et expédie les commandes avec paiement à la livraison."
      sections:
        - heading: "Ce que fait l'application"
          body:
            - "Seallo Connect importe les commandes éligibles avec paiement à la livraison de votre boutique Shopify vers votre espace Seallo. Votre équipe y confirme chaque commande par téléphone, gère le stock et prépare la livraison avec votre transporteur."
            - "Les commandes arrivent au statut Nouvelle. La confirmation, le stock et l'expédition restent sous le contrôle de votre équipe dans Seallo."
        - heading: "Comment la connecter"
          items:
            - "Installez Seallo Connect depuis le Shopify App Store et acceptez les accès demandés."
            - "Dans l’application, choisissez Connect with Seallo. Aucune offre Shopify n’est à sélectionner."
            - "Connectez-vous à Seallo, confirmez l’espace pour cette boutique, puis revenez sur Shopify. Rien à copier ni coller."
        - heading: "Commandes importées"
          body:
            - "Commandes avec paiement à la livraison, non payées et non expédiées, en MAD, livrées au Maroc, sans taxe ni remise. Des webhooks transmettent les nouvelles commandes et une synchronisation de rattrapage récupère celles qui auraient été manquées. Une même commande n'est jamais importée deux fois. Les autres commandes ne sont pas importées et apparaissent dans Seallo comme rejetées, avec le motif."
        - heading: "Ce que l'application ne fait pas"
          items:
            - "Elle ne modifie ni les commandes, ni les produits, ni les clients, ni le stock dans Shopify."
            - "Elle ne lit ni les adresses e-mail des clients ni les moyens de paiement."
        - heading: "Tarifs"
          body:
            - "Seallo Connect est gratuit sur Shopify : pas de frais d’application, d’essai ni de quota de commandes Shopify. Votre espace Seallo peut toujours nécessiter un abonnement Seallo actif pour la confirmation, le stock et la livraison."
        - heading: "Déconnexion"
          body:
            - "Vous pouvez vous déconnecter depuis l'application ou la désinstaller depuis Shopify à tout moment. L'import s'arrête et les identifiants de connexion sont supprimés. Les commandes déjà importées restent dans votre espace."
    pricing:
      title: "Tarifs"
      summary: "Seallo Connect est gratuit sur Shopify. La facturation de l’espace Seallo reste séparée."
      sections:
        - heading: "Aucun frais d’application Shopify"
          body:
            - "Seallo Connect n’a ni abonnement Shopify séparé, ni frais d’application, ni essai, ni quota de commandes Shopify. Relier votre boutique n’ajoute pas de ligne Seallo sur votre facture Shopify pour cette intégration."
        - heading: "Ce que comprend l’intégration gratuite"
          items:
            - "Import automatique des commandes éligibles avec paiement à la livraison, et synchronisation de rattrapage."
            - "Accès en lecture seule à vos commandes Shopify pour cet import."
            - "Aucun quota de commandes Shopify pour Seallo Connect."
        - heading: "Abonnement de l’espace Seallo"
          body:
            - "La confirmation, le stock et la livraison restent dans votre espace Seallo. Cet espace peut toujours nécessiter un abonnement Seallo actif selon les règles Morea. Cette facturation se gère dans Seallo, pas comme une offre Shopify App Pricing pour cette application."
        - heading: "Abonnements Shopify restants"
          body:
            - "Si vous étiez abonné à une offre Shopify retirée pour cette application, Shopify peut encore l’afficher. L’annulation se fait séparément dans la facturation Shopify."
    privacy:
      title: "Politique de confidentialité"
      summary: "Comment Seallo traite les données de commandes Shopify et les données Meta Ads pour les marchands."
      sections:
        - heading: "Champ d'application"
          body:
            - "Seallo Connect est une application Shopify qui relie la boutique Shopify d'un marchand à l'espace Seallo de ce marchand. Le marchand décide du traitement de ses commandes. Seallo traite les données de commandes pour son compte, afin de fournir le service."
            - "Cette politique couvre également la connexion facultative à Meta Ads décrite ci-dessous."
        - heading: "Données Shopify auxquelles nous accédons"
          body:
            - "Avec l'autorisation read_orders, pour chaque commande éligible avec paiement à la livraison, nous lisons :"
          items:
            - "Les coordonnées de l'acheteur figurant sur la commande : nom de livraison, numéro de téléphone et adresse de livraison (rue, ville, pays)."
            - "Les informations de la commande : numéro, date, devise, montants, articles, quantités, statuts de paiement et d'exécution."
            - "L'identité de la boutique : son domaine myshopify.com, ainsi que l'état d'installation de l'application."
        - heading: "Données Shopify auxquelles nous n'accédons pas"
          body:
            - "Nous ne lisons ni les adresses e-mail des acheteurs, ni les cartes de paiement, ni les comptes clients, ni les données marketing. L'application ne demande aucune autorisation sur le répertoire clients ou les produits et n'écrit rien dans votre boutique Shopify."
        - heading: "Utilisation"
          body:
            - "Uniquement pour présenter la commande à l'équipe du marchand dans Seallo, lui permettre de la confirmer auprès de l'acheteur, gérer le stock et préparer la livraison avec le transporteur choisi par le marchand. Nous ne vendons pas les données, ne les utilisons pas à des fins publicitaires et ne profilons pas les acheteurs."
        - heading: "Stockage et accès"
          body:
            - "Les commandes importées sont stockées dans l'espace Seallo du marchand et ne sont visibles que des personnes qu'il y a autorisées. Les espaces sont isolés les uns des autres. Les identifiants d'accès Shopify de l'application sont conservés dans une base de données à accès contrôlé, exploitée par notre hébergeur, et supprimés lors de la désinstallation. Toutes les communications utilisent HTTPS, et les requêtes entre Shopify, l'application et Seallo sont signées et vérifiées cryptographiquement."
        - heading: "Destinataires"
          body:
            - "Uniquement le transporteur que le marchand connecte, afin que les colis soient livrés, et les prestataires d'infrastructure nécessaires à l'hébergement du service. Aucun autre destinataire, sauf obligation légale."
        - heading: "Conservation et suppression"
          items:
            - "Tant que l'application est connectée, les commandes sont importées et conservées dans l'espace du marchand comme ses documents commerciaux."
            - "À la désinstallation ou à la déconnexion, l'import s'arrête et les identifiants de connexion sont supprimés. Les données de session Shopify de la boutique sont effacées. Les commandes déjà importées restent dans l'espace du marchand jusqu'à leur suppression par celui-ci ou l'application d'une demande de confidentialité Shopify."
            - "Les commandes Seallo terminées (livrées, annulées ou retournées) voient les coordonnées acheteur effacées après 180 jours par la tâche de rétention de la plateforme ; montants, statuts et identité de rejeu sont conservés."
            - "Lorsque Shopify envoie une demande de suppression de données d'un client ou d'une boutique, nous effaçons les coordonnées de l'acheteur, les notes et les événements des commandes concernées une fois celles-ci terminées. Les commandes en cours de livraison sont conservées et signalées au marchand pour examen jusqu'à leur clôture, afin de ne pas compromettre les livraisons. Les montants, statuts et identifiants nécessaires à la comptabilité et à la prévention d'un nouvel import sont conservés."
        - heading: "Meta Ads"
          body:
            - "Lorsque vous autorisez la connexion à Meta Ads, Seallo liste les comptes publicitaires que vous pouvez associer. Seallo lit le nom, la devise, le fuseau horaire et le statut du compte. Pour les comptes associés, Seallo lit les noms et les détails des campagnes, des ensembles de publicités et des publicités, les dépenses quotidiennes et les résultats communiqués par Meta, comme les impressions, les clics et les achats attribués."
            - "Seallo utilise ces données dans votre espace de travail pour présenter les coûts publicitaires et les inclure dans le calcul de la rentabilité des produits. L'accès aux publicités est en lecture seule. Seallo conserve le jeton d'accès Meta sous forme chiffrée pour synchroniser les comptes associés."
            - "Pour arrêter la synchronisation, ouvrez Meta Ads dans votre espace Seallo et sélectionnez Déconnecter. Seallo supprime le jeton d'accès, dissocie les comptes et demande à Meta de révoquer les autorisations. Vous pouvez également demander la suppression de vos données auprès de Meta. Lorsque Meta transmet la demande, Seallo supprime le jeton d'accès et l'identifiant d'utilisateur Meta des connexions concernées et arrête la synchronisation. Seallo conserve une empreinte de l'identifiant pour garder une trace de la suppression. Les dépenses déjà synchronisées restent dans l'espace du marchand et font partie de ses documents commerciaux."
        - heading: "Cookies"
          body:
            - "Ces pages publiques utilisent un cookie nécessaire pour mémoriser votre langue. Elles ne chargent pas les pixels Meta ou TikTok. Des polices peuvent être chargées depuis Google Fonts. Voir la politique de cookies pour le détail et vos choix."
        - heading: "Demandes de confidentialité des acheteurs"
          body:
            - "Les acheteurs doivent s'adresser au marchand auprès duquel ils ont acheté. Lorsque Shopify transmet une demande d'accès aux données d'un client, nous préparons un export des données de commandes importées le concernant, que le marchand examine et fournit. Marchands et autres demandeurs peuvent aussi utiliser le formulaire de droits lié depuis ce site, ou nous écrire à l'adresse ci-dessous."
        - heading: "Sécurité"
          body:
            - "Les requêtes de Shopify sont vérifiées avec la signature de Shopify, et les requêtes de serveur à serveur utilisent une clé de signature distincte avec une courte fenêtre de validité contre la falsification et le rejeu. L'accès aux données d'un espace est limité aux membres autorisés de cet espace."
        - heading: "Modifications"
          body:
            - "Nous mettrons à jour cette page et sa date lorsque nos pratiques évolueront."
    terms:
      title: "Conditions d'utilisation"
      summary: "Les conditions d'utilisation de Seallo Connect avec votre boutique Shopify."
      sections:
        - heading: "Le service"
          body:
            - "Seallo Connect importe les commandes éligibles avec paiement à la livraison de votre boutique Shopify vers votre espace Seallo. En installant ou en utilisant l'application, vous acceptez ces conditions et la politique de confidentialité."
        - heading: "Votre compte et vos droits"
          body:
            - "Vous devez être autorisé à installer des applications sur la boutique Shopify et à la connecter à l'espace Seallo choisi. Une boutique ne peut être liée qu'à un seul espace à la fois. Gardez vos codes de connexion confidentiels : ils sont à usage unique et expirent."
        - heading: "Abonnement et facturation"
          body:
            - "Seallo Connect n'a aucun frais d'application Shopify ni quota de commandes Shopify. Votre espace Seallo peut toujours nécessiter un abonnement Seallo actif pour utiliser la plateforme. La facturation de l'espace se gère dans Seallo selon ses propres conditions."
        - heading: "Vos responsabilités"
          items:
            - "Utiliser le service de façon licite et uniquement pour les commandes de votre propre boutique."
            - "Informer vos acheteurs de l'utilisation de leurs données et les traiter de façon licite, y compris pour les appels de confirmation et les livraisons."
            - "Vérifier les commandes importées. Vous restez responsable de leur confirmation, de leur expédition et de leur exécution."
        - heading: "Disponibilité"
          body:
            - "Nous veillons à la fiabilité des imports, via des webhooks et une synchronisation de rattrapage, mais ne pouvons garantir un service ininterrompu. Des incidents chez Shopify ou les transporteurs peuvent retarder les imports. Consultez l'état de la connexion dans l'application et dans Seallo."
        - heading: "Fin du service"
          body:
            - "Vous pouvez vous déconnecter ou désinstaller à tout moment. Nous pouvons suspendre une connexion qui enfreint ces conditions ou met la plateforme en danger. Les commandes importées restent dans votre espace, sous réserve de la politique de confidentialité."
        - heading: "Responsabilité"
          body:
            - "Le service est fourni en l'état, dans la mesure permise par la loi. Nous ne répondons pas des dommages indirects, tels que les ventes perdues, ni des retards ou défaillances causés par Shopify, les transporteurs ou d'autres tiers."
        - heading: "Modifications"
          body:
            - "Nous pouvons mettre à jour ces conditions. La date en haut de page indique la dernière version. La poursuite de l'utilisation vaut acceptation."
    cookie_policy:
      title: "Politique de cookies"
      summary: "Comment les pages publiques Seallo Connect utilisent les cookies et technologies similaires."
      sections:
        - heading: "Cookies nécessaires"
          body:
            - "Un cookie de langue mémorise le choix FR, EN ou AR sur ces pages pour que la visite suivante reste dans cette langue. Il est nécessaire au fonctionnement tel que vous l’avez configuré."
        - heading: "Cookies de mesure"
          body:
            - "Ces pages Seallo Connect ne chargent ni Meta Pixel, ni TikTok Pixel, ni autre script de mesure d’audience. Si vous visitez ensuite une vitrine marchande sur cette plateforme, cette vitrine a son propre bandeau et ne charge la mesure qu’après acceptation."
        - heading: "Polices et tiers"
          body:
            - "Les polices de la page peuvent être chargées depuis Google Fonts. Cette requête part vers les serveurs de Google. Voir aussi notre politique de confidentialité et l’inventaire des tiers dans la documentation produit."
        - heading: "Vos choix"
          body:
            - "Utilisez Accepter ou Refuser la mesure sur le bandeau. Les cookies nécessaires fonctionnent toujours si vous refusez. Vous pouvez effacer les cookies du site dans votre navigateur à tout moment."
    refunds:
      title: "Remboursements et résiliations"
      summary: "Facturation et résiliation maintenant que Seallo Connect n'a aucun frais d'application Shopify."
      sections:
        - heading: "Qui facture"
          body:
            - "Seallo Connect ne facture pas via Shopify App Pricing. Si vous payez un abonnement d'espace Seallo, cette facturation se gère dans Seallo, pas comme un frais Shopify pour cette application."
        - heading: "Résiliation"
          body:
            - "Déconnectez ou désinstallez Seallo Connect depuis Shopify à tout moment. L'import s'arrête. Les commandes déjà importées restent dans votre espace Seallo. Annulez un abonnement Shopify restant pour une offre retirée depuis la facturation Shopify s'il apparaît encore."
        - heading: "Remboursements"
          body:
            - "Il n'y a pas de frais d'application Shopify actuel pour Seallo Connect. Les remboursements d'éventuels frais Shopify historiques suivent les politiques de Shopify. Pour la facturation de l'espace Seallo, utilisez les coordonnées de ces pages ou votre espace Seallo."
        - heading: "Aucun frais caché"
          body:
            - "Seallo Connect n'ajoute aucun frais d'application Shopify. Les frais transporteur, boutique Shopify ou abonnement d'espace Seallo sont distincts."
    privacy_rights:
      title: "Vos droits"
      summary: "Demandez l’accès, la correction, l’opposition, la suppression ou un opt-out marketing liés à Seallo Connect ou à l’opérateur de la plateforme."
      unsubscribe_note: "Seallo Connect n’envoie pas de campagnes e-mail marketing depuis ces pages. Choisissez « Arrêter le marketing » pour enregistrer une préférence ou si vous avez reçu un message promotionnel sur l’application par un autre canal."
      minimization: "Ne fournissez que ce qui est nécessaire pour identifier votre demande. N’envoyez pas de mots de passe ni de numéros de carte."
      submit: "Envoyer la demande"
      submitted: "Votre demande a été enregistrée. Nous vous recontacterons avec les coordonnées fournies."
      fields:
        type: "Type de demande"
        name: "Votre nom"
        contact: "E-mail ou téléphone"
        contact_help: "Comment nous joindre pour cette demande."
        shop_domain: "Domaine boutique Shopify (optionnel)"
        details: "Détails (optionnel)"
      types:
        access: "Accéder à mes données"
        rectify: "Corriger mes données"
        object: "M’opposer au traitement"
        delete: "Supprimer mes données"
        unsubscribe: "Arrêter le marketing"
      statuses:
        open: "Ouverte"
        in_progress: "En cours"
        resolved: "Résolue"
        rejected: "Refusée"
      admin:
        title: "Demandes de droits plateforme"
        instructions: "Demandes depuis les pages publiques Seallo Connect. Marquez-les résolues après avoir répondu."
        empty: "Aucune demande pour l’instant."
        back: "Retour aux demandes"
        resolve: "Marquer résolue"
        resolved: "Demande marquée résolue."
