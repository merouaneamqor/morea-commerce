ar:
  shopify_reconnect:
    manage: إدارة
    reconnect: إعادة الربط في Shopify
    title: إعادة ربط هذا المتجر
    help: افتح Seallo Connect في قسم التطبيقات بمتجر %{shop}، أو أعد تثبيته إذا حُذف. اتبع خطوات تفويض Shopify ثم أكّد الربط
      بمساحة %{workspace}.
    preserve_history: احتفظ بهذا الاتصال أثناء إعادة الربط لإعادة استخدام الطلبات المستوردة وسجلّها. يظل غير متصل حتى نجاح
      التفويض.
