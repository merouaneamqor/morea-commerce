# Strings of the seallo signup steps that exist only in Morea (the rest comes from config/seallo_auth_dictionary.json).
fr:
  signup_plans:
    invalid: "Choisissez un plan valide."
    changed: "Votre plan a bien été changé."
  signup_payment:
    reference_required: "Indiquez la référence du virement."
    reference_too_long: "La référence est trop longue (100 caractères maximum)."
    declared: "Merci ! Nous vérifions votre virement et activons votre abonnement dès réception."
  signup_flow:
    password_hint: "%{count} caractères minimum"
    workspace_label: "Adresse de l’espace"
    workspace_help: "Votre e-mail est associé à plusieurs espaces : saisissez le sous-domaine de l’espace."
en:
  signup_plans:
