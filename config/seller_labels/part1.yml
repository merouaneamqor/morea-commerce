? Charge de travail et statut actuels. Actif = l'agent a pointé son arrivée. La charge est le nombre de commandes en attente qui lui sont attribuées, sur une capacité de
: en: "Current workload and status. Active = the agent has checked in. The workload is the number of pending orders assigned to them, out of a capacity of"
  ar: "عبء العمل والحالة الحالية. نشط = الوكيل سجّل حضوره. عبء العمل هو عدد الطلبات المعلّقة المعيّنة له، من أصل سعة قدرها"
