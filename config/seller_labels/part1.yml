? Chiffres calculés sur les commandes créées pendant la période (reçues, jointes, confirmées, expédiées, livrées) et sur les appels passés pendant la période. Les jours récents sont provisoires. Le taux d'upsell n'est pas encore calculé.
: en: "Figures computed on orders created during the period (received, reached, confirmed, shipped, delivered) and on calls made during the period. Recent days are provisional. The upsell rate is not calculated yet."
  ar: "أرقام محسوبة على الطلبات المنشأة خلال الفترة (الواردة، التي تم الوصول إليها، المؤكَّدة، المشحونة، المسلّمة) وعلى المكالمات التي أُجريت خلال الفترة. الأيام الأخيرة مؤقتة. لم يُحسب معدل البيع الإضافي (upsell) بعد."
  es: "Cifras calculadas sobre los pedidos creados durante el periodo (recibidos, localizados, confirmados, enviados, entregados) y sobre las llamadas realizadas durante el periodo. Los días recientes son provisionales. La tasa de upsell aún no está calculada."
