? Le vert est meilleur que la médiane de l'équipe et le rouge moins bon, quel que soit le sens de l'indicateur. Cliquez sur un agent pour ouvrir son profil.
: en: "Green is better than the team median and red is worse, whatever the direction of the indicator. Click an agent to open their profile."
  ar: "الأخضر أفضل من وسيط الفريق والأحمر أسوأ منه، مهما كان اتجاه المؤشر. انقر على وكيل لفتح ملفه."
  es: "El verde es mejor que la mediana del equipo y el rojo peor, sea cual sea el sentido del indicador. Haz clic en un agente para abrir su perfil."
