  en: "Agents versus the team median"
  ar: "الوكلاء مقارنةً بوسيط الفريق"
  es: "Los agentes frente a la mediana del equipo"
? 'Les chiffres de l''agent à côté de la médiane de toute l''équipe, et l''écart entre les deux. Un bon écart est en vert et un mauvais en rouge, quel que soit le sens de l''indicateur : un délai plus court avant le premier appel est une bonne chose.'
: en: "The agent's figures next to the median of the whole team, and the gap between the two. A good gap is green and a bad one is red, whatever the direction of the indicator: a shorter delay before the first call is a good thing."
  ar: "أرقام الوكيل إلى جانب وسيط الفريق كله، والفارق بينهما. الفارق الجيد بالأخضر والسيئ بالأحمر، مهما كان اتجاه المؤشر: فمهلة أقصر قبل المكالمة الأولى أمر جيد."
  es: "Las cifras del agente junto a la mediana de todo el equipo, y la diferencia entre ambas. Una buena diferencia aparece en verde y una mala en rojo, sea cual sea el sentido del indicador: un plazo más corto antes de la primera llamada es algo bueno."
