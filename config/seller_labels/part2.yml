Les règles sont exécutées par ordre de priorité. Utilisez les flèches pour les réorganiser.:
  en: "Rules are run in priority order. Use the arrows to reorder them."
  ar: "تُنفَّذ القواعد حسب ترتيب الأولوية. استخدم الأسهم لإعادة ترتيبها."
  es: "Las reglas se ejecutan por orden de prioridad. Usa las flechas para reordenarlas."
? 'Les règles sont lues de haut en bas, par ordre de priorité. Quand une commande arrive, la première règle active dont les conditions correspondent choisit l''agent : parmi ses agents qui sont actifs et en ligne (leur pointage est ouvert), en parts égales (50/50 avec deux agents) ou selon le pourcentage de chacun, sur la journée de la boutique.'
: en: "Rules are read from top to bottom, in priority order. When an order comes in, the first active rule whose conditions match picks the agent: among its agents who are active and online (their check-in is open), in equal shares (50/50 with two agents) or according to each one's percentage, over the store's day."
  ar: "تُقرأ القواعد من الأعلى إلى الأسفل حسب الأولوية. عند وصول طلب، تختار أول قاعدة نشطة تنطبق شروطها الوكيل: من بين وكلائها النشطين والمتصلين (تسجيل حضورهم مفتوح)، بحصص متساوية (50/50 مع وكيلين) أو حسب نسبة كل منهم، خلال يوم المتجر."
  es: "Las reglas se leen de arriba abajo, por orden de prioridad. Cuando llega un pedido, la primera regla activa cuyas condiciones coincidan elige al agente: entre sus agentes que están activos y en línea (su fichaje está abierto), a partes iguales (50/50 con dos agentes) o según el porcentaje de cada uno, durante la jornada de la tienda."
