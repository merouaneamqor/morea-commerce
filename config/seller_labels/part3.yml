Seules les commandes avec un appel enregistré sont comptées.:
  en: "Only orders with a recorded call are counted."
  ar: "تُحتسب فقط الطلبات التي لها مكالمة مسجّلة."
  es: "Solo se cuentan los pedidos con una llamada registrada."
? Seuls les agents dont le taux de réussite (30 derniers jours) est au moins égal reçoivent les commandes. Un agent sans appel reste éligible.
: en: "Only agents whose success rate (last 30 days) is at least equal receive orders. An agent with no calls remains eligible."
  ar: "لا يتلقى الطلبات إلا الوكلاء الذين تساوي نسبة نجاحهم (آخر 30 يومًا) هذه النسبة على الأقل. ويبقى الوكيل الذي لم يُجرِ أي مكالمة مؤهَّلًا."
  es: "Solo los agentes cuya tasa de éxito (últimos 30 días) sea al menos igual reciben los pedidos. Un agente sin llamadas sigue siendo elegible."
Si l'agent est trop lent:
  en: "If the agent is too slow"
  ar: "إذا كان الوكيل بطيئًا جدًا"
  es: "Si el agente es demasiado lento"
? Si l'agent n'a pas confirmé la commande dans le délai de la règle (30 minutes par défaut), elle passe automatiquement à un autre agent actif et en ligne. Sans règle qui correspond, ou si personne n'est en ligne, la commande reste ouverte à tous les agents.
: en: "If the agent has not confirmed the order within the rule's time limit (30 minutes by default), it automatically moves to another active, online agent. With no matching rule, or if nobody is online, the order stays open to all agents."
  ar: "إذا لم يؤكد الوكيل الطلب خلال مهلة القاعدة (30 دقيقة افتراضيًا)، ينتقل تلقائيًا إلى وكيل آخر نشط ومتصل. وإذا لم توجد قاعدة مطابقة، أو لم يكن أحد متصلًا، يبقى الطلب متاحًا لجميع الوكلاء."
  es: "Si el agente no ha confirmado el pedido dentro del plazo de la regla (30 minutos por defecto), pasa automáticamente a otro agente activo y en línea. Si ninguna regla coincide, o si nadie está en línea, el pedido queda abierto a todos los agentes."
