# Morea on Render — links existing morea-db + morea-redis by name.
# Env secrets (RAILS_MASTER_KEY) are set on the service; DB/Redis use fromDatabase/fromService.
services:
  - type: web
    name: morea
    runtime: ruby
    plan: free
    region: frankfurt
    branch: main
    buildCommand: chmod +x bin/render-build.sh bin/render-start.sh && bin/render-build.sh
    startCommand: bin/render-start.sh
    envVars:
      - key: RAILS_ENV
        value: production
      - key: APP_HOST
        value: ollazen.com
      - key: APP_BASE_DOMAIN
        value: ollazen.com
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DISCORD_ORDERS_WEBHOOK_URL
        sync: false
      - key: ORDERS_JWT_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: SENDIT_PUBLIC_KEY
        sync: false
      - key: SENDIT_SECRET_KEY
        sync: false
      - key: SENDIT_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: morea-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: morea-redis
          type: keyvalue
          property: connectionString
      # Same service. bin/render-start.sh listens here and the Rails client
      # restarts it if the process is down.
      - key: RECOLOR_SERVICE_URL
        value: http://127.0.0.1:8000
      - key: RECOLOR_TIMEOUT
        value: "120"
      - key: RECOLOR_MAX_EDGE
        value: "1000"

databases:
  - name: morea-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

# Key Value (Redis-compatible) is managed as a separate resource named morea-redis.
